['play', 'pause', 'playing', 'timeupdate', 'durationchange', 'loadedmetadata', 'ended', 'emptied'].forEach((ev) => audio.addEventListener(ev, () => {

// The browser's own casting: used when Google's library isn't available, and for AirPlay on iPhone
let castWatching = false;

  } else if (audio.webkitShowPlaybackTargetPicker) {

/* ---------- A verse: Daily Drift itself ----------
   The prayer hands open Daily Drift's own page, fetched live from its site and run untouched in a layer over Aarti:
   its stars and light, the sound when you touch, the stars gliding as you tilt the phone, pull for another verse.
   A few lines run first inside it and do only four things:
     1. keep its storage apart, under Aarti's own name (aar.dd.*), so Daily Drift's own settings, sets and verses are never touched;
     2. switch its Faith on with Hinduism, start it on its dark themes, skip its install welcome, and show its
        "Pull down for another verse" each time a verse opens (once the sound is on, until they pull);
     3. send its round arrow, and the phone's Back, home to Aarti;
     4. stop two fingers zooming it, as on Aarti's own pages.
   If its page can't be reached, or the few names Aarti relies on change, the hands simply stay hidden. */
const Drift = (() => {
  const DD = new URL('../DailyDrift/', location.href).href;
  // what Aarti relies on in Daily Drift's page
  const HOOKS = ['function openFaith(', 'data-act="back"', "const P = 'ddr.'", 'id="verseBlk"'];
  // Runs inside the layer before anything of Daily Drift's. Storage is patched in the layer's own world only, not Aarti's.
  const SHIM = `(function () {
  'use strict';
  var KEEP = 'aar.dd.';
  var FORCE = { faith: 'true', faiths: '["hinduism"]', installSeen: 'true', faithHinted: 'true', vpulled: 'false' };
  var FIRST = { tone: '"dark"', themeN: '0' };
  var pr = Storage.prototype, rd = pr.getItem, wr = pr.setItem, rm = pr.removeItem;
  function own(k) { k = String(k); return k.indexOf('ddr.') === 0 ? k.slice(4) : k; }
  pr.getItem = function (k) { var n = own(k); if (FORCE.hasOwnProperty(n)) return FORCE[n]; var v = rd.call(this, KEEP + n); return v == null && FIRST.hasOwnProperty(n) ? FIRST[n] : v; };
  pr.setItem = function (k, v) { var n = own(k); if (!FORCE.hasOwnProperty(n)) wr.call(this, KEEP + n, v); };
  pr.removeItem = function (k) { rm.call(this, KEEP + own(k)); };
  var ok = false;
  try { localStorage.setItem('ddr.zzprobe', '1'); ok = rd.call(localStorage, KEEP + 'zzprobe') === '1' && rd.call(localStorage, 'ddr.zzprobe') == null; rm.call(localStorage, KEEP + 'zzprobe'); } catch (e) {}
  if (!ok) { try { window.stop(); } catch (e) {} parent.postMessage({ aartiDrift: 'failed' }, '*'); return; }
  try { if (navigator.serviceWorker) navigator.serviceWorker.register = function () { return Promise.resolve(); }; } catch (e) {}
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) { document.addEventListener(g, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var gone = false;
  function leave() { if (!gone) { gone = true; parent.postMessage({ aartiDrift: 'closed' }, '*'); } }
  addEventListener('popstate', function (e) { e.stopImmediatePropagation(); leave(); }, true);
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest && e.target.closest('[data-act=back]');
    if (!b) return;
    e.stopImmediatePropagation(); e.preventDefault();
    if (history.state && history.state.dd === 'faith') history.back(); else leave();
  }, true);
})();`;
  // Daily Drift's Settings, without the rows that mean nothing here
  const TIDY = 'html{touch-action:pan-x pan-y}#faithRow,#faiths,#faithNote,#insRow,#insNote,#settings .set:has([data-act=newSet]),#settings .about,#hintFaith{display:none!important}';
  let page = null, job = null, layer = null, frame = null, opening = false;

  async function text(url) {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 9000);
    try {
      const r = await fetch(url, { cache: 'no-cache', signal: c.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } finally { clearTimeout(t); }
  }
  // Daily Drift's page, ready to run: its scripts written in, so it also opens offline from Aarti's saved copy
  function prepare() {
    if (page) return Promise.resolve(true);
    if (job) return job;
    job = (async () => {
      try {
        const html = await text(DD);
        if (!HOOKS.every((h) => html.includes(h))) throw new Error('Daily Drift has changed');
        let out = html;
        for (const m of [...html.matchAll(/<script src="([^"]+)"><\/script>/g)]) {
          const js = await text(new URL(m[1], DD).href);
          out = out.replace(m[0], () => '<script>' + js.replace(/<\/script/gi, '<\\/script') + '<\/script>');
        }
        page = out.replace(/<head>/i, () => `<head><base href="${DD}"><script>${SHIM}<\/script><style>${TIDY}</style>`);
      } catch { page = null; }
      job = null;
      hands();
      return !!page;
    })();
    return job;
  }
  function hands() {
    const h = $('#faithBtn');
    if (h) h.classList.toggle('gone', !(page && S.unlocked && ['home', 'done'].includes(S.route.r)));
  }
  // Verses seen on Aarti's own verse screen (releases 4 to 6) carry over, once
  function carryOver() {
    const old = get('verses', null);
    if (Array.isArray(old) && localStorage.getItem('aar.dd.verses') == null) {
      const vs = old.filter((v) => v && v.t).slice(-80).map((v, i) => ({ f: 'hinduism', ref: v.ref, t: v.t, by: v.by, at: v.at || Date.now(),
        id: v.id || 'a' + (v.at || Date.now()).toString(36) + i }));
      try { localStorage.setItem('aar.dd.verses', JSON.stringify(vs)); } catch {}
    }
    if (old != null) { try { localStorage.removeItem(P + 'verses'); localStorage.removeItem(P + 'vpulled'); } catch {} }
  }
  async function open() {
    if (layer || opening) return;
    opening = true;
    const ok = page || await prepare();
    opening = false;
    if (!ok) { toast('The verses can’t be reached just now. Try again when you’re online.'); return; }
    if (layer) return;
    carryOver();
    layer = document.createElement('div');
    layer.className = 'dd-layer';
    layer.innerHTML = `<div class="drift" role="img" aria-label="Opening Daily Drift"><span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <span class="orbit o1"><i></i></span><span class="orbit o2"><i></i></span><span class="orbit o3"><i></i></span><span class="core"></span></div>`;
    frame = document.createElement('iframe');
    frame.title = 'A verse from the Bhagavad Gita, in Daily Drift';
    frame.setAttribute('allow', 'accelerometer; gyroscope; magnetometer; autoplay; web-share; clipboard-write');
    frame.srcdoc = page;
    layer.append(frame);
    document.body.append(layer);
    document.documentElement.classList.add('drifting');
    FX.hold(true);
    requestAnimationFrame(() => requestAnimationFrame(() => layer && layer.classList.add('on')));
    const mine = layer, f = frame;
    setTimeout(() => { if (layer === mine && !mine.classList.contains('ready')) failed(); }, 20000);   // never leave the loader turning
    f.addEventListener('load', async () => {
      if (layer !== mine) return;
      const w = f.contentWindow;
      try {
        if (typeof w.openFaith !== 'function' || w.eval('typeof S') !== 'object') throw new Error('no faith');
        colours(w);
        w.openFaith();
        for (let i = 0; i < 100 && layer === mine && w.eval('S.view') !== 'faith'; i++) await new Promise((r) => setTimeout(r, 40));
        if (layer !== mine) return;
        if (w.eval('S.view') !== 'faith') throw new Error('no verse view');
        mine.classList.add('ready');
        try { f.focus(); } catch {}
      } catch { failed(); }
    }, { once: true });
  }
  // Its colours fill the strips by the notch and home bar, and the phone's bar takes its colour
  function colours(w) {
    const root = w.document.documentElement, meta = document.querySelector('meta[name=theme-color]');
    const paint = () => {
      if (!layer) return;
      const bg = root.style.getPropertyValue('--bg').trim(), bg2 = root.style.getPropertyValue('--bg-2').trim();
      if (bg) { layer.style.setProperty('--dd-bg', bg); meta.setAttribute('content', bg); }

    new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['style'] });
    paint();
  }
  function close() {
    if (!layer) return;
    const l = layer, f = frame;
    layer = null; frame = null;
    try { const w = f.contentWindow; if (w && typeof w.pauseAudio === 'function') w.pauseAudio(); } catch {}   // its own gentle fade
    l.classList.remove('on');
    setTimeout(() => {
      l.remove();
      document.documentElement.classList.remove('drifting');
      FX.hold(false); Water.start(); Flames.wake();
      setRoom(S.route.r === 'aarti' ? S.route.id : 'night');
      const h = $('#faithBtn'); if (h && !h.classList.contains('gone')) h.focus({ preventScroll: true });
    }, reduced() ? 0 : 460);
  }
  function failed() {
    page = null;
    close();
    hands();
    toast('The verses can’t open just now.');
  }
  window.addEventListener('message', (e) => {
    if (!frame || e.source !== frame.contentWindow || !e.data) return;
    if (e.data.aartiDrift === 'closed') close();
    else if (e.data.aartiDrift === 'failed') failed();
  });
  return { prepare, open, ready: () => !!page, isOpen: () => !!layer };
})();

/* ---------- Swipe between the aartis ----------
   Drag an aarti sideways and the next one (or the one before) slides in beside it, its painting moving a little slower than
   the page, as through a window, its words arriving just behind. Let go past a third of the way, or with a flick, and it
   carries on at the finger's own speed into the next room, colours and all; otherwise it settles back. It can be caught
   mid-way. The first and last aartis give a little and spring back. The arrow keys do the same; the dots still jump.
   The first time an aarti opens, the page leans aside once to show the next painting is there. */
const Swipe = (() => {
  const PAR = .38, WORDS = .14;                 // the painting runs this much slower than the page; the words trail by this much
  let g = null, x = 0, dir = 0, peek = null, pk = null, cur = null, raf = 0, landing = false, teaseT = 0, wantNeighbour = 0;
  const i0 = () => AARTIS.findIndex((a) => a.id === S.route.id);
  const on = () => S.unlocked && S.route.r === 'aarti' && i0() >= 0;
  const W = () => innerWidth;
  const anyOpen = () => !!document.querySelector('dialog[open], .dd-layer, .spot');
  // the page's own pieces, found once per page
  function pieces() {
    if (cur && cur.room && cur.room.isConnected) return cur;
    const art = $('#art');
    cur = { art, move: art && art.querySelector('.art-move'), room: $('#screen .room'), fade: $('#screen .topfade') };
    return cur;
  }
  function peekHtml(a, i) {
    return `<div class="art"><div class="art-move"><div class="art-blur" style="background-image:url('${a.blur}')"></div>
      <img class="art-img ready" src="${esc(a.art)}" alt="" decoding="sync"></div><div class="art-shade"></div></div>
      <div class="room"><header class="room-top">
        <p class="eyebrow">${esc(a.deity)} · ${i + 1} of ${AARTIS.length}</p>
        <p class="room-title">${esc(a.title)}</p>
        <p class="room-dev" lang="hi">${esc(a.titleD)}</p>
        <p class="room-tag">${esc(a.tagline)}</p>
        <span class="hint">${ICON.chevDown}Scroll for the words</span>
      </header></div>`;
  }
  function makePeek(d) {
    const i = i0() + d, a = AARTIS[i];
    if (!a) return;
    peek = document.createElement('div');
    peek.className = 'peek'; peek.dataset.room = a.id; peek.setAttribute('aria-hidden', 'true');
    peek.innerHTML = peekHtml(a, i);
    document.body.append(peek);
    pk = { move: peek.querySelector('.art-move'), room: peek.querySelector('.room'), id: a.id };
  }
  function dropPeek() { if (peek) peek.remove(); peek = pk = null; }
  // a little give past the first and last aartis
  const rubber = (d) => { const L = W() * .32; return Math.sign(d) * (1 - 1 / (Math.abs(d) * .55 / L + 1)) * L; };
  function apply(nx) {
    x = nx;
    const P = pieces(); if (!P.room) return;
    const want = x < -.5 ? 1 : x > .5 ? -1 : 0;
    if (want !== dir) { dropPeek(); dir = want; if (want && AARTIS[i0() + want]) makePeek(want); }
    const w = W(), p = Math.min(1, Math.abs(x) / w);
    document.documentElement.classList.toggle('swipe-on', !!x);
    if (P.art) P.art.style.transform = x ? `translate3d(${x}px,0,0)` : '';
    if (P.move) P.move.style.transform = x ? `translate3d(${-x * PAR}px,0,0)` : '';
    P.room.style.transform = x ? `translate3d(${x * (1 + WORDS * .6)}px,0,0)` : '';
    P.room.style.opacity = x ? String(1 - p * .55) : '';
    if (P.fade) P.fade.style.transform = x ? `translate3d(${x}px,0,0)` : '';
    if (peek) {
      const px = x + (dir > 0 ? w : -w), q = Math.min(1, Math.abs(px) / w);
      peek.style.transform = `translate3d(${px}px,0,0)`;
      pk.move.style.transform = `translate3d(${-px * PAR}px,0,0)`;
      pk.room.style.transform = `translate3d(${px * WORDS}px,0,0)`;
      pk.room.style.opacity = String(1 - q * .7);
    }
  }
  function clear() {
    cancelAnimationFrame(raf); raf = 0;
    dropPeek(); dir = 0; x = 0;
    const P = cur && cur.room && cur.room.isConnected ? cur : null;
    if (P) { for (const el of [P.art, P.move, P.room, P.fade]) if (el) el.style.transform = ''; P.room.style.opacity = ''; }
    cur = null;
    document.documentElement.classList.remove('swipe-on');
  }
  // a spring with the finger's speed in it; critically damped, and it never runs past where it's going
  function spring(to, v0, done, k = 240) {
    cancelAnimationFrame(raf);
    const c = 2 * Math.sqrt(k);
    let v = v0 * 1000, last = performance.now(), from = x;
    const tick = (now) => {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const n = Math.max(1, Math.ceil(dt / .004)), h = dt / n;
      let nx = x;
      for (let j = 0; j < n; j++) { v += (-k * (nx - to) - c * v) * h; nx += v * h; }
      if ((from - to) * (nx - to) < 0) { nx = to; v = 0; }        // no overshoot: the other edge never shows
      apply(nx);
      if (Math.abs(nx - to) < .5 && Math.abs(v) < 25) { raf = 0; apply(to); done(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  // carry on into the neighbour
  function commit(d, v0) {
    const i = i0() + d, a = AARTIS[i];
    if (!a) return settle(v0);
    landing = true;
    document.documentElement.classList.add('swiping'); setRoom(a.id);       // the colours flow over as it slides
    const ds = document.querySelectorAll('#dots .dot');
    ds.forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
    spring(-d * W(), v0, () => {
      const keep = peek; peek = pk = null; dir = 0; x = 0; cur = null;
      const prev = (history.state && history.state.prev) || 'home';
      history.replaceState({ r: 'aarti', id: a.id, prev }, '');
      S.route = { r: 'aarti', id: a.id };
      render(true);
      landing = false;
      document.documentElement.classList.remove('swiping', 'swipe-on');
      const img = $('.art-img');
      let gone = false;
      const go2 = () => { if (gone || !keep) return; gone = true; requestAnimationFrame(() => { keep.classList.add('leaving'); setTimeout(() => keep.remove(), 260); }); };
      if (!img || img.classList.contains('ready')) go2(); else { img.addEventListener('load', go2, { once: true }); setTimeout(go2, 900); }
    }, 260);
  }
  function settle(v0) { spring(0, v0 || 0, clear, 300); }

  // ----- the finger -----
  const selecting = () => { const t = window.getSelection && window.getSelection(); return !!(t && String(t).length); };
  document.addEventListener('touchstart', (e) => {
    g = null;
    clearTimeout(teaseT);
    if (!on() || landing || navigating || e.touches.length !== 1 || anyOpen() || selecting()) return;
    const el = e.target;
    if (!el.closest || !el.closest('#screen') || el.closest('#dock, input, textarea, select, .seek, [contenteditable]')) return;
    const t = e.touches[0];
    // caught mid-way (settling back, or leaning aside): carry on from where it is
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    const caught = Math.abs(x) > .5;
    g = { x0: t.clientX - (caught ? rawFor(x) : 0), y0: t.clientY, lock: caught ? 'x' : null, s: [] };
  }, { passive: true });
  // the finger distance that gives this offset (undoing the give at the ends)
  function rawFor(off) {
    const d = off < 0 ? 1 : -1;
    if (AARTIS[i0() + d]) return off;
    const L = W() * .32, r = Math.min(.95, Math.abs(off) / L);
    return Math.sign(off) * (1 / (1 - r) - 1) * L / .55;
  }
  function offsetFor(dx) { const d = dx < 0 ? 1 : -1; return AARTIS[i0() + d] ? dx : rubber(dx); }
  document.addEventListener('touchmove', (e) => {
    if (!g || e.touches.length !== 1) { if (g && g.lock === 'x') { settle(0); } g = null; return; }
    const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
    if (!g.lock) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.15) { g.lock = 'x'; g.x0 += Math.sign(dx) * 10; Spot.hide(); }
      else { g = null; return; }                       // scrolling the words: let it be
    }
    if (e.cancelable) e.preventDefault();
    const now = performance.now(), ddx = t.clientX - g.x0;
    g.s.push([now, ddx]); while (g.s.length > 2 && now - g.s[0][0] > 100) g.s.shift();
    if (reduced()) { g.dx = ddx; return; }
    apply(offsetFor(ddx));
  }, { passive: false });
  const end = (e) => {
    if (!g) return;
    const G = g; g = null;
    if (G.lock !== 'x') return;
    const a = G.s[0], b = G.s[G.s.length - 1];
    const v = a && b && b[0] > a[0] && performance.now() - b[0] < 80 ? (b[1] - a[1]) / (b[0] - a[0]) : 0;   // px per ms
    const off = reduced() ? (G.dx || 0) : x, w = W();
    const d = off < 0 ? 1 : -1;
    const pass = !!AARTIS[i0() + d] && (Math.abs(off) > w * .3 || (Math.abs(v) > .35 && Math.sign(v) === Math.sign(off) && Math.abs(off) > 14));
    if (reduced()) { if (pass) { clear(); go({ r: 'aarti', id: AARTIS[i0() + d].id }, true); } return; }
    if (pass) commit(d, v); else settle(v);

  document.addEventListener('touchcancel', end);

  // ----- the keyboard: arrows move between the aartis -----
  document.addEventListener('keydown', (e) => {
    if (!on() || landing || navigating || raf || anyOpen() || e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    if (e.target.closest && e.target.closest('input, textarea, select, .seek, [contenteditable], .seg')) return;
    const d = e.key === 'ArrowRight' ? 1 : -1;
    e.preventDefault();
    if (!AARTIS[i0() + d]) { if (reduced()) return; apply(-d * 1); spring(-d * 26, -d * .5, () => settle(0), 420); return; }
    if (reduced()) { go({ r: 'aarti', id: AARTIS[i0() + d].id }, true); return; }

  });

  // ----- once, the page leans aside to show there's another painting beside it -----
  function tease() {
    clearTimeout(teaseT);
    if (!on() || get('swipeHinted', false) || reduced()) return;
    teaseT = setTimeout(() => {
      if (!on() || g || raf || x || landing || anyOpen() || scrollY > 40 || document.visibilityState !== 'visible') return;
      put('swipeHinted', true);
      const d = AARTIS[i0() + 1] ? 1 : -1;
      apply(-d * 1);
      spring(-d * Math.min(72, W() * .18), 0, () => { teaseT = setTimeout(() => { if (!g && x) settle(0); }, 320); }, 120);

  }
  return { drop() { if (!landing) { clearTimeout(teaseT); if (g) g = null; clear(); } }, tease, get busy() { return !!raf || landing; } };
})();

/* ---------- Gestures: drag a sheet down (or aside) to close it. ---------- */
(function gestures() {
  let g = null;
  const sideScroller = (el) => {
    for (let n = el; n && n !== document.body; n = n.parentElement) {
      if (n.scrollWidth > n.clientWidth + 2) { const ox = getComputedStyle(n).overflowX; if (ox === 'auto' || ox === 'scroll') return true; }
    }
    return false;
  };
  const selecting = () => { const s = window.getSelection && window.getSelection(); return !!(s && String(s).length); };
  document.addEventListener('touchstart', (e) => {
    g = null;
    if (e.touches.length !== 1 || !sheet.open) return;
    const t = e.touches[0], el = e.target;
    if (!sheet.contains(el) || el.closest('input, textarea, select, [contenteditable], .seek') || sideScroller(el) || selecting()) return;
    g = { x0: t.clientX, y0: t.clientY, t0: performance.now(), dir: null, grab: !!el.closest('[data-grab]') };
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
    if (!g.dir) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) && dx > 0) g.dir = 'right';
      else if (g.grab && dy > 0 && Math.abs(dy) > Math.abs(dx)) g.dir = 'down';
      else { g = null; return; }   // scrolling: let it go
    }
    e.preventDefault();
    g.dx = dx; g.dy = dy;
    const now = performance.now();
    (g.samples = g.samples || []).push([now, g.dir === 'down' ? dy : dx]);
    while (g.samples.length > 2 && now - g.samples[0][0] > 120) g.samples.shift();
    if (reduced()) return;
    sheet.style.transform = g.dir === 'right' ? `translateX(${Math.max(0, dx)}px)` : `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });

  const end = async () => {
    if (!g || !g.dir) { g = null; return; }
    const G = g; g = null;
    const dist = G.dir === 'down' ? G.dy || 0 : G.dx || 0;
    // speed over the last tenth of a second or so, so a flick counts even after a slow start
    const sm = G.samples || [], s0 = sm[0], s1 = sm[sm.length - 1];
    const v = s0 && s1 && s1[0] > s0[0] ? (s1[1] - s0[1]) / (s1[0] - s0[0]) : dist / Math.max(1, performance.now() - G.t0);
    const far = G.dir === 'down' ? dist > sheet.offsetHeight / 4 : dist > innerWidth / 3;
    if (!(far || v > 0.5)) {
      sheet.classList.add('springing'); sheet.style.transform = '';
      setTimeout(() => sheet.classList.remove('springing'), 300);
      return;
    }
    if (!reduced()) {
      sheet.classList.add('springing');
      sheet.style.transform = G.dir === 'down' ? 'translateY(100%)' : `translateX(${innerWidth}px)`;
      await new Promise((r) => setTimeout(r, 200));
    }
    closeSheet();
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
})();

// While an update lands, a phone can briefly have this page with the previous core.js; these keep it working
if (!C.lineAt) C.lineAt = (T, t) => { let at = -1; for (let i = 0; i < T.length; i++) if (T[i] <= t) at = i; return at; };
if (!C.timesOk) C.timesOk = () => false;
if (!C.lineCount) C.lineCount = (a) => C.blocks(a).reduce((n, b) => n + b.lines.length + (b.cue ? [].concat(b.cue).length : 0), 0);

/* ---------- Words that follow the song ----------
   When an aarti's lines have start times (times: [...] in aartis.js, or timed on G's phone), the line being sung
   lights up and the page glides to keep it a little above the middle. Scroll by hand and the gliding stops;
   "Follow the song" brings it back. It follows the TV too while casting.
   Timing (G's phones only, from Settings): the song plays from the start and G taps as each line begins. */
const Sync = (() => {
  const LEAD = .3;                       // a line lights this many seconds early, so the eye is there in time
  let raf = 0, cur = -1, follow = true, rem = { t: -1, at: 0 }, chipEl = null, timing = null, panel = null;
  const aarti = () => (S.route.r === 'aarti' ? AARTIS.find((a) => a.id === S.route.id) : null);
  const lineEl = (i) => document.querySelector(`.words .ln[data-i="${i}"]`);
  const owner = () => !!get('noCount', false);
  function timesFor(a) {
    if (!a || !a.audio || srcFor(a).kind !== 'file') return null;
    const n = C.lineCount(a), mine = owner() ? get('times:' + a.id, null) : null;
    if (mine && mine.audio === a.audio && C.timesOk(mine.times, n)) return mine.times;
    return C.timesOk(a.times, n) ? a.times : null;
  }
  // where the song is: on the phone, or on the TV (its time comes about once a second, so it's carried on between)
  function position(key) {
    if (cafOn() && remoteKey() === key) {
      const R = CAF.player, t = R.currentTime || 0, now = performance.now();
      if (t !== rem.t) rem = { t, at: now };
      const playing = !R.isPaused && R.playerState === 'PLAYING';
      return { t: playing ? rem.t + Math.min(2, (now - rem.at) / 1000) : t, playing };
    }
    if (S.cur === key) return { t: audio.currentTime || 0, playing: !audio.paused && !audio.ended };
    return null;
  }
  function light(i) {
    if (i === cur && (i < 0 || (lineEl(i) && lineEl(i).classList.contains('sung')))) return;
    document.querySelectorAll('.words .ln.sung').forEach((el) => el.classList.remove('sung'));
    cur = i;
    const el = i >= 0 && lineEl(i);
    if (el) el.classList.add('sung');
  }
  function toLine(i, at) {
    const el = lineEl(i);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const y = window.scrollY + r.top + r.height / 2 - innerHeight * (at || .4);
    window.scrollTo({ top: Math.max(0, y), behavior: reduced() ? 'auto' : 'smooth' });
  }
  function chip(show) {
    if (!chipEl) {
      chipEl = document.createElement('button');
      chipEl.className = 'follow-chip'; chipEl.type = 'button'; chipEl.hidden = true;
      chipEl.innerHTML = `${ICON.chevDown}Follow the song`;
      chipEl.addEventListener('click', () => { follow = true; chip(false); if (cur >= 0) toLine(cur); });
      document.body.append(chipEl);
    }
    chipEl.hidden = !show;
  }
  function tick() {
    raf = 0;
    const a = aarti(), words = $('#words');
    if (!a || !words) { chip(false); return; }
    const key = 'a:' + a.id, pos = position(key);
    if (timing) {
      if (timing.id !== a.id) { stopTiming(); return; }
      const clock = panel && panel.querySelector('.tp-clock');
      if (clock && pos) clock.textContent = C.fmtTime(pos.t);
      if (pos && pos.playing) raf = requestAnimationFrame(tick);
      return;
    }
    const times = timesFor(a);
    words.classList.toggle('synced', !!times);
    if (!times || !pos) { light(-1); chip(false); return; }
    const i = C.lineAt(times, pos.t + LEAD);
    if (i !== cur) { light(i); if (follow && pos.playing && i >= 0) toLine(i); }
    chip(!follow && pos.playing && i >= 0);
    if (pos.playing) raf = requestAnimationFrame(tick);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
  // scrolling by hand stops the gliding (taps on the bar don't)
  const byHand = (e) => {
    if (timing || !e.target.closest || e.target.closest('#dock, .follow-chip, .timing-panel, dialog')) return;
    const a = aarti(), pos = a && timesFor(a) && position('a:' + a.id);
    if (pos && pos.playing && follow) { follow = false; chip(cur >= 0); }
  };
  addEventListener('touchmove', byHand, { passive: true });
  addEventListener('wheel', byHand, { passive: true });
  addEventListener('keydown', (e) => { if (['PageDown', 'PageUp', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) byHand(e); });
  audio.addEventListener('play', () => { if (!timing) { follow = true; chip(false); } kick(); });
  audio.addEventListener('seeked', () => { cur = -2; kick(); });

  // ----- timing (G's phones) -----
  function beginTiming(id) {
    const a = AARTIS.find((x) => x.id === id);
    if (!a || !a.audio) return;
    if (cafOn()) { toast('Stop casting first: time the words on the phone.'); return; }
    if (!aarti() || aarti().id !== id) { S.pendingTiming = id; go({ r: 'aarti', id }, S.route.r === 'aarti'); return; }
    stopTiming(true);
    timing = { id, n: C.lineCount(a), times: [], audio: a.audio };
    document.documentElement.classList.add('timing-on');
    $('#words').classList.add('timing'); $('#words').classList.remove('synced');
    light(-1); chip(false);
    panel = document.createElement('div');
    panel.className = 'timing-panel'; panel.id = 'timing'; panel.setAttribute('role', 'region'); panel.setAttribute('aria-label', 'Timing the words');
    document.body.append(panel);
    paint();
    const pl = $('#dock .player');
    if (S.cur !== 'a:' + id) load('a:' + id, pl.dataset.url, pl.dataset.title, pl.dataset.sub, pl.dataset.art);
    try { audio.currentTime = 0; } catch {}
    audio.play().then(setMedia).catch(() => toast('Tap the big button to start.'));
    toLine(0, .45);
    kick();
  }
  function paint() {
    if (!panel || !timing) return;
    const k = timing.times.length, a = AARTIS.find((x) => x.id === timing.id);
    document.querySelectorAll('.words .ln.next').forEach((el) => el.classList.remove('next'));
    if (timing.done) {
      const ok = timing.times.length === timing.n;
      panel.innerHTML = `<div class="tp-done">${ok
        ? `<p>All ${timing.n} lines of ${esc(a.title)} timed. This phone now follows them; send them over to put them in for everyone.</p>
          <div class="actions"><button class="btn primary" type="button" data-tact="copy">Copy timings</button>
          <button class="btn" type="button" data-tact="again">Time again</button><button class="btn" type="button" data-tact="close">Close</button></div>`
        : `<p>The song ended with ${timing.n - k} of ${timing.n} lines still to tap.</p>
          <div class="actions"><button class="btn primary" type="button" data-tact="again">Time again</button><button class="btn" type="button" data-tact="close">Close</button></div>`}</div>`;
      return;
    }
    const el = lineEl(k);
    if (el) el.classList.add('next');
    const txt = el ? el.querySelector('.main').textContent || (el.querySelector('.sub') || {}).textContent || '' : '';
    panel.innerHTML = `<div class="tp-head"><span class="tp-count num">Line ${k + 1} of ${timing.n}</span><span class="tp-clock num">0:00</span>
        <button type="button" data-tact="undo"${k ? '' : ' disabled'}>Undo</button><button type="button" data-tact="stop">Stop</button></div>
      <button class="tp-tap" type="button" data-tact="tap"><small>Tap as this line begins</small><span>${esc(txt)}</span></button>`;
  }
  function tap() {
    if (!timing || timing.done || S.cur !== 'a:' + timing.id) return;
    if (audio.paused) { audio.play().catch(() => {}); return; }
    const k = timing.times.length, t = Math.round(audio.currentTime * 100) / 100;
    timing.times.push(Math.max(t, k ? timing.times[k - 1] : 0));
    light(k);
    const btn = panel.querySelector('.tp-tap'); if (btn) { btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 120); }
    if (timing.times.length === timing.n) finish();
    else { paint(); toLine(k + 1, .45); }
  }
  function undo() {
    if (!timing || timing.done || !timing.times.length) return;
    const back = timing.times.pop(), k = timing.times.length;
    light(k - 1);
    try { audio.currentTime = Math.max(0, back - 4); } catch {}
    paint(); toLine(k, .45);
  }
  function finish() {
    timing.done = true;
    if (timing.times.length === timing.n) put('times:' + timing.id, { audio: timing.audio, times: timing.times, at: Date.now() });
    paint();
  }
  function stopTiming(quiet) {
    if (!timing) return;
    timing = null;
    if (panel) { panel.remove(); panel = null; }
    document.documentElement.classList.remove('timing-on');
    const w = $('#words'); if (w) w.classList.remove('timing');
    document.querySelectorAll('.words .ln.next').forEach((el) => el.classList.remove('next'));
    cur = -2; follow = true;
    if (!quiet) kick();
  }
  const timingsText = (id) => {
    const m = get('times:' + id, null), a = AARTIS.find((x) => x.id === id);
    return m ? `Aarti timings · ${id} · ${a.audio} · ${m.times.length} lines\n${JSON.stringify(m.times)}` : '';
  };
  async function copy(id) {
    const text = timingsText(id);
    if (!text) return;
    try { await navigator.clipboard.writeText(text); toast('Timings copied'); }
    catch {
      if (panel) { const ta = document.createElement('textarea'); ta.readOnly = true; ta.value = text; panel.querySelector('.tp-done').append(ta); ta.select(); }
      toast('Select the text and copy it');
    }
  }
  document.addEventListener('pointerdown', (e) => {
    const t = e.target.closest && e.target.closest('[data-tact="tap"]');
    if (t) { e.preventDefault(); tap(); }
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest && e.target.closest('[data-tact]');
    if (!t || !timing) return;
    const k = t.dataset.tact;
    if (k === 'undo') undo();
    else if (k === 'stop') { stopTiming(); audio.pause(); toast('Timing stopped'); }
    else if (k === 'copy') copy(timing.id);
    else if (k === 'again') beginTiming(timing.id);
    else if (k === 'close') { stopTiming(); }
  });
  document.addEventListener('keydown', (e) => {
    if (!timing || e.target.closest('input, textarea')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) tap(); }
    else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
    else if (e.key === 'Escape') { stopTiming(); audio.pause(); }
  });
  audio.addEventListener('ended', () => { if (timing && !timing.done) finish(); });

  // Settings, on G's phones: time each aarti
  function ownerHtml() {
    if (!owner()) return '';
    const rows = AARTIS.filter((a) => a.audio).map((a) => {
      const n = C.lineCount(a), mine = get('times:' + a.id, null), local = mine && mine.audio === a.audio && C.timesOk(mine.times, n);
      const state = local ? 'Timed on this phone' : C.timesOk(a.times, n) ? 'Timed for everyone' : 'Not timed yet';
      return `<li><span>${esc(a.title)}<small>${n} lines · ${state}</small></span><span class="row-btns">
        ${local ? `<button class="mini" type="button" data-act="copyTimes" data-id="${a.id}">Copy</button>` : ''}
        <button class="mini" type="button" data-act="timeWords" data-id="${a.id}">Time</button></span></li>`;
    }).join('');
    return `<h3>Time the words</h3><p>Plays the aarti from the start. Tap the big button as each line begins; Undo steps back a line. On a computer, the space bar taps.</p>
      <ul class="list">${rows}</ul>`;
  }
  function afterRender() {
    cur = -2; follow = true; chip(false);
    if (timing && (!aarti() || aarti().id !== timing.id)) stopTiming(true);
    if (S.pendingTiming && aarti() && aarti().id === S.pendingTiming) { const id = S.pendingTiming; S.pendingTiming = null; setTimeout(() => beginTiming(id), 350); }
    kick();
  }
  return { kick, afterRender, beginTiming, ownerHtml, copy, get timing() { return !!timing; } };
})();

/* ---------- Visits: a note to G on Telegram each time Aarti is opened ----------
   One message per visit, kept up to date while it lasts: when it was opened, how long it was on screen (time in the
   background doesn't count), where they went and what they did, roughly where they are (the town their internet
   connection is in, from a free lookup) and what kind of phone or computer (Android, iPhone, Mac, Windows). It goes through G's own Apps Script, which holds the bot's token;
   nothing secret is in this page. Off until API (top of the script) has the web app address.
   G's own phones are left out: open Aarti once with #me at the end of its address, or tap "Release" in Settings
   five times. #count (or five taps again) puts a phone back in. */
const Visits = (() => {
  const GAP = 30 * 60 * 1000;                     // away for longer than this, and coming back is a new visit
  const counting = () => !!API && !get('noCount', false) && !navigator.webdriver;
  let v = null, shown = 0, timer = 0, beat = 0, where = null, dev = null, started = false, taps = [];
  const rid = () => { const a = new Uint8Array(10); crypto.getRandomValues(a); return [...a].map((x) => (x % 36).toString(36)).join('') + Date.now().toString(36).slice(-4); };
  const secs = () => (v ? v.secs + (shown ? (performance.now() - shown) / 1000 : 0) : 0);
  const save = () => { if (v) put('visit', { ...v, secs: Math.round(secs()), last: Date.now() }); };
  function begin() {
    const n = get('visits', 0) + 1; put('visits', n);
    v = { id: rid(), n, secs: 0, pages: [], did: [], via: S.cameByLink ? 'link' : standalone ? 'app' : 'browser' };
    save();
  }
  function payload(open) {
    let puja = '';
    try { const pl = myPlace(); puja = (pl && pl.city) || ''; } catch {}
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch {}
    return JSON.stringify({ action: 'visit', id: v.id, n: v.n, secs: Math.round(secs()), open, pages: v.pages, did: v.did,
      place: where || {}, puja, tz, dev: dev || {}, via: v.via, release: RELEASE });
  }
  function send(open, leaving) {
    if (!started || !v || !counting()) return;
    const body = payload(open);
    try {
      if (leaving && navigator.sendBeacon && navigator.sendBeacon(API, body)) return;
      fetch(API, { method: 'POST', body, keepalive: true, credentials: 'omit' }).catch(() => {});
    } catch {}
  }
  const soon = (ms) => { clearTimeout(timer); timer = setTimeout(() => { if (shown) send(true); }, ms); };
  // roughly where: the town the internet connection is in, looked up at most every few hours
  async function lookup() {
    const c = get('where', null);
    if (c && c.p && Date.now() - c.at < 6 * 3600e3) { where = c.p; return; }
    const one = async (url, pick) => {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
      try { const r = await fetch(url, { signal: ctl.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }); return r.ok ? pick(await r.json()) : null; }
      catch { return null; } finally { clearTimeout(t); }
    };
    where = await one('https://ipwho.is/?fields=success,city,region,country,flag.emoji',
      (j) => (j && j.success !== false && j.country ? { city: j.city || '', region: j.region || '', country: j.country, flag: (j.flag && j.flag.emoji) || '' } : null))
      || await one('https://get.geojs.io/v1/ip/geo.json', (j) => (j && j.country ? { city: j.city || '', region: j.region || '', country: j.country, flag: '' } : null));
    if (where) put('where', { at: Date.now(), p: where });
  }
  // the phone: just what kind (Android, iPhone, iPad, Mac, Windows), no model or versions
  function device() {
    const os = isAndroid ? 'Android' : /iPhone|iPod/.test(UA) ? 'iPhone' : isIOS ? 'iPad' : /Windows/.test(UA) ? 'Windows'
      : /CrOS/.test(UA) ? 'Chromebook' : /Mac OS X|Macintosh/.test(UA) ? 'Mac' : /Linux/.test(UA) ? 'Linux' : '';
    dev = { os };
  }
  function onVis() {
    if (!v) return;
    if (document.visibilityState === 'hidden') {
      if (shown) { v.secs += (performance.now() - shown) / 1000; shown = 0; }
      clearTimeout(timer); save(); send(false, true);
    } else if (!shown) {
      const last = (get('visit', null) || {}).last || 0;
      if (Date.now() - last > GAP) { S.cameByLink = false; begin(); if (page.last) v.pages.push(page.last); }
      shown = performance.now(); save(); soon(4000);
    }
  }
  function start() {
    if (started || !counting()) return;
    started = true;
    const old = get('visit', null);
    if (old && old.id && Date.now() - (old.last || 0) < GAP) v = { id: old.id, n: old.n, secs: old.secs || 0, pages: old.pages || [], did: old.did || [], via: old.via };
    else begin();
    if (page.last) page(page.last);
    shown = document.visibilityState === 'visible' ? performance.now() : 0;
    device();
    lookup().then(() => soon(600));
    soon(4000);
    beat = setInterval(() => { if (shown) { save(); send(true); } }, 120000);
    document.addEventListener('visibilitychange', onVis);
    addEventListener('pagehide', () => { if (shown) { v.secs += (performance.now() - shown) / 1000; shown = 0; } save(); send(false, true); });
  }
  function page(k) {
    page.last = k;
    if (!v) return;
    if (v.pages[v.pages.length - 1] !== k && v.pages.length < 30) { v.pages.push(k); save(); if (started) soon(5000); }
  }
  function did(k) {
    if (!v || v.did.includes(k) || v.did.length >= 20) return;
    v.did.push(k); save(); if (started) soon(5000);
  }

  // ----- G's own phones -----
  function leaveOut(off) {
    put('noCount', !!off);
    if (off) { clearTimeout(timer); clearInterval(beat); started = false; v = null; localStorage.removeItem(P + 'visit'); }
    else start();
    toast(off ? 'This phone won’t be counted in visit messages' : 'This phone is counted again');
    const box = $('#owner'); if (box) box.outerHTML = ownerHtml();
    ownerCheck();
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest || !e.target.closest('[data-rel]')) return;
    const now = Date.now(); taps = taps.filter((t) => now - t < 2500); taps.push(now);
    if (taps.length >= 5) { taps = []; leaveOut(!get('noCount', false)); }
  });
  function ownerHtml() {
    if (!get('noCount', false)) return '<div id="owner" hidden></div>';
    return `<div class="owner" id="owner"><p class="small">This phone isn’t counted. Visit messages: <span id="ownerState">${API ? 'checking…' : 'off (the Apps Script address isn’t in index.html yet)'}</span></p>
      ${API ? '<div class="actions"><button class="btn" type="button" data-act="tgTest">Send test message</button></div>' : ''}</div>`;
  }
  async function call(action, method) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = method === 'GET' ? await fetch(`${API}?action=${action}`, { signal: ctl.signal, credentials: 'omit' })
        : await fetch(API, { method: 'POST', body: JSON.stringify({ action }), signal: ctl.signal, credentials: 'omit' });
      return await r.json();
    } finally { clearTimeout(t); }
  }
  async function ownerCheck() {
    const el = $('#ownerState');
    if (!el || !API) return;
    let txt;
    try {
      const j = await call('ping', 'GET');
      if (!j || !j.ok) txt = 'Apps Script answered oddly';
      else if ((j.build || 0) < EXPECT_BUILD) txt = `Apps Script is out of date (release ${j.build || 0}, Aarti needs ${EXPECT_BUILD}): Deploy → Manage deployments → Edit → New version`;
      else if (!j.ready) txt = 'Apps Script needs BOT_TOKEN and CHAT_ID in Script Properties';
      else txt = `on (Apps Script release ${j.build})`;
    } catch { txt = 'couldn’t reach Apps Script'; }
    if (el.isConnected) el.textContent = txt;
  }
  async function test(btn) {
    btn.disabled = true;
    try { const j = await call('test', 'POST'); toast(j && j.ok ? 'Test message sent. Check Telegram.' : (j && j.error) || 'Apps Script didn’t answer'); }
    catch { toast('Couldn’t reach Apps Script'); }
    btn.disabled = false;
  }
  return { start, page, did, leaveOut, ownerHtml, ownerCheck, test };
})();

/* ---------- Start ---------- */
(function start() {
  const pin = C.pinFromHash(location.hash);
  if (pin && C.pinOk(pin, PIN)) { S.unlocked = true; put('ok', true); }
  S.cameByLink = !!pin;
  const me = /[#&]me(?:&|$)/.test(location.hash), back = /[#&]count(?:&|$)/.test(location.hash);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  setSize(S.set.size);
  saveSet();
  history.replaceState({ r: 'home' }, '');
  render(true);
  if (me || back) Visits.leaveOut(me); else Visits.start();
  // #me or #count added to the address of a page that's already open
  addEventListener('hashchange', () => {
    const h = location.hash, m2 = /[#&]me(?:&|$)/.test(h), c2 = /[#&]count(?:&|$)/.test(h);
    if (m2 || c2) { history.replaceState(history.state, '', location.pathname + location.search); Visits.leaveOut(m2); }
  });
  loadCastLib();
  setTimeout(() => Drift.prepare(), 1200);          // Daily Drift's page, made ready in the background for the hands
  addEventListener('online', () => { if (!Drift.ready()) Drift.prepare(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
