<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aarti</title>
<meta name="description" content="Diwali aartis to sing together, with words, meaning and casting.">
<meta name="theme-color" content="#0E0B14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aarti">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Lora:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Colours glide from one aarti to the next */
@property --bg{syntax:'<color>';inherits:true;initial-value:#0E0B14}
@property --raise{syntax:'<color>';inherits:true;initial-value:#1A1520}
@property --raise-2{syntax:'<color>';inherits:true;initial-value:#251E2C}
@property --ink{syntax:'<color>';inherits:true;initial-value:#F3EBDD}
@property --ink-2{syntax:'<color>';inherits:true;initial-value:#BCB0A0}
@property --ink-3{syntax:'<color>';inherits:true;initial-value:#7F7468}
@property --sun{syntax:'<color>';inherits:true;initial-value:#F2B65A}
@property --sun-soft{syntax:'<color>';inherits:true;initial-value:rgba(242,182,90,.18)}
@property --on-sun{syntax:'<color>';inherits:true;initial-value:#1F1304}
@property --tint{syntax:'<color>';inherits:true;initial-value:#E27B3C}
@property --glass{syntax:'<color>';inherits:true;initial-value:rgba(20,16,26,.58)}
@property --line{syntax:'<color>';inherits:true;initial-value:rgba(243,235,221,.12)}
:root{
  /* Night: the opening, the PIN and the close */
  --bg:#0E0B14;--raise:#1A1520;--raise-2:#251E2C;--ink:#F3EBDD;--ink-2:#BCB0A0;--ink-3:#7F7468;
  --sun:#F2B65A;--sun-soft:rgba(242,182,90,.18);--on-sun:#1F1304;--tint:#E27B3C;--glass:rgba(20,16,26,.58);--line:rgba(243,235,221,.12);
  --sans:"Hanken Grotesk","Tiro Devanagari Hindi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora","Tiro Devanagari Hindi",Georgia,"Noto Serif Devanagari",serif;
  --deva:"Tiro Devanagari Hindi","Noto Serif Devanagari","Kohinoor Devanagari",serif;
  --ls:21px;color-scheme:dark;
  transition:--bg 1.2s ease,--raise 1.2s ease,--raise-2 1.2s ease,--ink 1.2s ease,--ink-2 1.2s ease,--ink-3 1.2s ease,--sun 1.2s ease,
    --sun-soft 1.2s ease,--on-sun 1.2s ease,--tint 1.2s ease,--glass 1.2s ease,--line 1.2s ease;
}
/* Ganesh: saffron and marigold, with vermilion */
:root[data-room="ganesh"]{--bg:#1B0F05;--raise:#2A180A;--raise-2:#38210F;--ink:#FCEEDC;--ink-2:#DABC97;--ink-3:#9A7B5B;
  --sun:#F7AB3C;--sun-soft:rgba(247,171,60,.2);--on-sun:#241302;--tint:#E0532F;--glass:rgba(33,18,6,.6);--line:rgba(252,238,220,.13)}
/* Lakshmi: deep crimson and gold, with lotus pink */
:root[data-room="lakshmi"]{--bg:#1E070D;--raise:#2D0E16;--raise-2:#3B1520;--ink:#FDEDE8;--ink-2:#E2B7B2;--ink-3:#A0716F;
  --sun:#EEC566;--sun-soft:rgba(238,197,102,.2);--on-sun:#2A1704;--tint:#F09DB1;--glass:rgba(36,9,16,.6);--line:rgba(253,237,232,.13)}
/* Jagdish: night-sky blue, with pitambar yellow */
:root[data-room="jagdish"]{--bg:#08122B;--raise:#0F1D3D;--raise-2:#17284E;--ink:#EEF2FB;--ink-2:#AEBBD8;--ink-3:#71809F;
  --sun:#F5CA52;--sun-soft:rgba(245,202,82,.2);--on-sun:#201802;--tint:#52B8B4;--glass:rgba(9,20,46,.6);--line:rgba(238,242,251,.13)}
:root[data-size="large"]{--ls:24px} :root[data-size="largest"]{--ls:28px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
[lang="hi"]{font-family:var(--deva)}
.serif{font-family:var(--serif)}

/* Floating top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.top > *{pointer-events:auto}
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);flex:none;transition:opacity .4s}
.orb svg{width:21px;height:21px}
.orb.gone{opacity:0;visibility:hidden}
.dots{display:flex;align-items:center;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:opacity .4s}
.dots.gone{opacity:0;visibility:hidden}
.dot{width:36px;height:44px;display:grid;place-items:center}
.dot::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--ink-3);transition:width .4s cubic-bezier(.2,.8,.2,1),background .4s}
.dot[aria-current="true"]::before{width:22px;background:var(--sun)}

/* Moving between screens: a soft veil in the next colour */
.veil{position:fixed;inset:0;z-index:18;pointer-events:none;background:radial-gradient(70% 55% at 50% 45%,var(--sun-soft),var(--bg) 70%);opacity:0;transition:opacity .28s ease}
.veil.on{opacity:1}

/* Sparks, embers and petals */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

#screen{position:relative}
#screen.dragging{will-change:transform}
#screen.springing{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.swipe-arrow{position:fixed;left:14px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);color:var(--ink);opacity:0;pointer-events:none;z-index:21}
.swipe-arrow svg{width:20px;height:20px}

/* The diya */
.diya{display:block;overflow:visible}
.diya .rangoli{fill:none;stroke:var(--line);stroke-linecap:round}
.diya .rangoli .dots{stroke-width:2.2;stroke-dasharray:0 7.2}
.diya .rangoli .ring{stroke-width:1}
.diya .rangoli .petal{fill:var(--line);stroke:none}
.diya .glow{opacity:0;transition:opacity 1.6s ease}
.diya.lit .glow{opacity:1;animation:breathe-glow 4.5s ease-in-out infinite}
.diya .flame-g{transform-box:view-box;transform-origin:100px 113px;opacity:0}
.diya.lit .flame-g{opacity:1}
.diya.lighting .flame-g{animation:ignite 1.1s cubic-bezier(.2,.8,.2,1) both}
.diya .flame{transform-box:view-box;transform-origin:100px 113px}
.diya.lit .flame{animation:flicker 3.4s ease-in-out infinite}
.diya .invite{fill:none;stroke:var(--sun);stroke-width:1.2;opacity:0;transform-box:view-box;transform-origin:100px 112px}
.diya:not(.lit) .invite{animation:invite 3.2s ease-out infinite}
@keyframes flicker{0%,100%{transform:scale(1,1) skewX(0)}18%{transform:scale(.97,1.05) skewX(1.6deg)}37%{transform:scale(1.02,.96) skewX(-1.1deg)}55%{transform:scale(.98,1.03) skewX(.9deg)}78%{transform:scale(1.01,.98) skewX(-1.5deg)}}
@keyframes breathe-glow{50%{opacity:.72}}
@keyframes ignite{from{transform:scale(.04);opacity:0}45%{opacity:1}to{transform:scale(1);opacity:1}}
@keyframes invite{0%{opacity:0;transform:scale(.6)}25%{opacity:.28}100%{opacity:0;transform:scale(1.08)}}

/* Opening, PIN and closing: a dark room around the diya */
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(70px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom));position:relative;z-index:2}
.stage::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(65% 42% at 50% 34%,var(--sun-soft),transparent 72%);opacity:0;transition:opacity 1.8s ease}
.stage.is-lit::before{opacity:1}
.diya-btn{display:block;width:min(64vw,250px);aspect-ratio:1;border-radius:50%;margin:0 auto}
.diya-btn .diya{width:100%;height:100%}
.stage-title{margin:8px 0 0;font:400 36px/1.12 var(--serif);letter-spacing:-.01em}
.stage-lead{margin:12px auto 0;max-width:21em;font:300 18px/1.55 var(--sans);color:var(--ink-2)}
.more{display:grid;justify-items:center;gap:20px;margin-top:24px;width:100%}
.stage:not(.is-lit) .more.after-light{display:none}
.rise{animation:rise-in .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise-in{from{opacity:0;transform:translateY(16px)}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,25rem)}
.tile{position:relative;display:block;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--raise);text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%;transition:transform .6s ease}
.tile:active img{transform:scale(1.05)}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:26px 9px 9px;background:linear-gradient(transparent,rgba(0,0,0,.7));font:400 15px/1.2 var(--serif);color:#fff}
.tile small{display:block;font:500 11.5px var(--sans);color:rgba(255,255,255,.75);margin-bottom:2px}
.quiet{font-size:13px;line-height:1.5;color:var(--ink-3);max-width:24rem;margin:4px auto 0}

/* Buttons */
.btn{height:46px;padding:0 22px;border-radius:23px;background:var(--raise-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--sun);color:var(--on-sun);box-shadow:0 8px 26px var(--sun-soft)}
.btn svg{width:18px;height:18px;flex:none}
.link-btn{color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);min-height:44px;display:inline-flex;align-items:center;gap:8px}
.link-btn svg{width:17px;height:17px}

/* Notices */
.notice{display:flex;gap:10px;align-items:center;margin:0 auto 18px;max-width:25rem;padding:8px 8px 8px 14px;border-radius:16px;background:var(--glass);font-size:14px;color:var(--ink-2);text-align:left}
.notice p{margin:0;flex:1}
.notice .link-btn{color:var(--sun);font-weight:600;text-decoration:none}
.notice .x{color:var(--ink-3);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.notice .x svg{width:16px;height:16px}

/* PIN */
.pin-field{display:block;margin:20px auto 0;width:12rem;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--glass);
  text-align:center;font-size:26px;letter-spacing:.4em;padding-left:.4em}
.pin-field::placeholder{color:var(--ink-3)}
.pin-field.bad{border-color:var(--sun)}
.form-note{margin:10px auto 0;font-size:14px;color:var(--sun);max-width:20rem}
.form-note:empty{display:none}

/* A room for each aarti: the painting behind, the words rising over it */
.art{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.art-move{position:absolute;inset:-16px;transform:translate3d(var(--tx,0px),var(--ty,0px),0)}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;opacity:0;transition:opacity 1.1s ease;
  animation:breathe 30s ease-in-out infinite alternate}
.art-img.ready{opacity:1}
@keyframes breathe{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.art-blur{position:absolute;inset:-40px;background-size:cover;background-position:50% 22%;filter:blur(22px) saturate(1.15);opacity:var(--dim,0)}
.art-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.32) 0%,transparent 16%,transparent 46%,var(--bg) 94%)}
.art-dim{position:absolute;inset:0;background:var(--bg);opacity:calc(var(--dim,0) * .74)}
.room{position:relative;z-index:2}
.room-top{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(96px + env(safe-area-inset-bottom));max-width:34rem;margin:0 auto}
.eyebrow{margin:0;font:500 13px var(--sans);color:var(--ink-2);letter-spacing:.02em}
.room-title{margin:6px 0 0;font:400 40px/1.06 var(--serif);letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.room-dev{margin:8px 0 0;font-size:23px;line-height:1.4;color:var(--sun)}
.room-tag{margin:6px 0 0;font:300 16px/1.45 var(--sans);color:var(--ink-2)}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13px;color:var(--ink-2);opacity:calc(1 - var(--hint,0) * 2.4)}
.topfade{position:fixed;top:0;left:0;right:0;height:calc(92px + env(safe-area-inset-top));z-index:3;pointer-events:none;
  background:linear-gradient(var(--bg) 40%,transparent);opacity:var(--dim,0)}
.hint svg{width:16px;height:16px}
.room-body{max-width:34rem;margin:0 auto;padding:4px 20px calc(130px + env(safe-area-inset-bottom))}
.story{margin:0;font:300 18px/1.6 var(--sans);color:var(--ink)}
.glass{border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
.doing{display:flex;gap:12px;margin:18px 0 0;padding:14px 16px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.doing svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--sun)}
.play-card{margin:16px 0 0;padding:16px}
.play-note{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.play-src{margin:4px 0 0;font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;column-gap:10px}
.play-src .link-btn{font-size:13.5px}
.own-tag{color:var(--sun)}

/* Words: the verse in the middle of the screen glows, the rest fade back */
.words{margin-top:36px}
.block{margin:0 0 30px;opacity:var(--o,1);transition:opacity .45s ease}
.block.refrain{padding-left:16px;border-left:2px solid var(--sun)}
.block-tag{margin:0 0 8px;font:500 12.5px var(--sans);color:var(--ink-3);letter-spacing:.02em}
.ln{margin:0 0 9px;font:400 var(--ls)/1.5 var(--serif)}
.ln .x{margin-left:8px;font:500 12.5px var(--sans);color:var(--ink-3);white-space:nowrap;vertical-align:2px}
.ln .sub{display:block;margin-top:2px;font:400 max(13px,calc(var(--ls)*.64))/1.45 var(--sans);color:var(--ink-3)}
.ln.echo{padding-left:20px;color:var(--ink-2);font-size:calc(var(--ls)*.88)}
.ln.cue{color:var(--sun);font-size:calc(var(--ls)*.8)}
.words[data-mode="dev"] .ln .main{font-size:1.1em;line-height:1.55}
.words[data-mode="en"] .ln .main{font-size:.94em}
.words[data-mode="en"] .ln.echo .main:empty{display:none}
.words[data-mode="en"] .ln.echo .sub{margin-top:0}

/* What comes next: the next painting rises at the end */
.next-card{position:relative;display:block;width:100%;height:240px;margin-top:40px;border-radius:24px;overflow:hidden;text-align:left;background:var(--raise)}
.next-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.06);transition:transform 1s ease}
.next-card:active img{transform:scale(1.1)}
.next-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.72))}
.next-text{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.next-text small{display:block;font:500 12.5px var(--sans);color:rgba(255,255,255,.8)}
.next-text strong{display:block;margin-top:2px;font:400 27px/1.15 var(--serif)}
.next-text span{display:block;margin-top:3px;font:300 14px var(--sans);color:rgba(255,255,255,.82)}
.finish-card{display:flex;align-items:center;gap:14px;width:100%;margin-top:40px;padding:18px;text-align:left}
.finish-card .diya{width:66px;height:66px;flex:none;margin:-6px}
.finish-card strong{display:block;font:400 24px var(--serif)}
.finish-card span{display:block;font-size:14px;color:var(--ink-2)}

/* The dock: play, how to show the words, and casting. It tucks away as you scroll down. */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(0,0,0,.38);transform:translate(-50%,0);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;max-width:calc(100% - 20px)}
.dock.away{transform:translate(-50%,150%);opacity:0}
.seg{display:flex;gap:2px}
.seg button{height:44px;min-width:44px;padding:0 13px;border-radius:22px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--raise-2);color:var(--ink)}
.seg [lang="hi"]{font-size:15.5px}
.dock-play{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--on-sun);flex:none}
.dock-play svg{width:19px;height:19px}

/* Players: recordings and the test bell */
.player{display:flex;align-items:center;gap:12px}
.player.mini{gap:4px}
.round-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--on-sun);flex:none}
.round-btn svg{width:22px;height:22px}
.player.mini .round-btn{width:44px;height:44px}
.player.mini .round-btn svg{width:18px;height:18px}
.pl-mid{flex:1;min-width:0}
.pl-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-time{font-size:13px;color:var(--ink-2)}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:none}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--sun),var(--sun)) 0/var(--p,0%) 100% no-repeat,var(--line)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-6px}
.seek::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--sun)}
.seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none;position:relative}
.icon-btn svg{width:22px;height:22px}
.icon-btn[hidden]{display:none}
.cast[aria-pressed="true"]{color:var(--sun);background:var(--sun-soft)}

/* Spinner: a comet */
.spinner,.btn.busy::after{border-radius:50%;background:conic-gradient(from 90deg,transparent 10%,currentColor 95%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2px));animation:spin .8s linear infinite}
.spinner{display:inline-block;width:20px;height:20px;vertical-align:middle}
.btn.busy{pointer-events:none}
.btn.busy::after{content:"";width:13px;height:13px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sheets */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:34rem;max-height:88vh;border:0;border-radius:24px 24px 0 0;padding:0;background:var(--raise);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet[open]{animation:sheet-rise .3s cubic-bezier(.2,.8,.2,1)}
dialog.sheet.springing{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
dialog.sheet::backdrop{background:rgba(4,4,8,.6)}
@keyframes sheet-rise{from{transform:translateY(40px);opacity:0}}
.sheet-in{padding:10px 22px calc(28px + env(safe-area-inset-bottom))}
.grab-zone{margin:-10px -22px 0;padding:10px 22px 0;touch-action:none}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font:400 24px var(--serif)}
.sheet-head .icon-btn{margin-right:-10px}
.sheet h3{margin:26px 0 8px;font-size:15px;font-weight:600}
.sheet p{margin:6px 0;color:var(--ink-2);font-size:15px}
.sheet .small{font-size:13.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 15px;border-radius:20px;background:var(--raise-2);font-size:14px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li span small{display:block;color:var(--ink-3);font-size:12.5px}
.list .mini{color:var(--ink-2);font-size:14px;font-weight:600;padding:0 4px;min-height:44px}
.field{width:100%;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.field::placeholder{color:var(--ink-3)}
.field.bad{border-color:var(--sun)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:16px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--raise-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--sun)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-sun)}
.test-box{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg)}
.result{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
.result:empty{display:none}

/* Toast: a popover so it shows above open sheets */
.toast{position:fixed;inset:auto auto calc(84px + env(safe-area-inset-bottom)) 50%;margin:0;border:0;width:max-content;max-width:calc(100% - 40px);transform:translate(-50%,0);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;text-align:center;z-index:30;overflow:visible;
  display:none;align-items:center;gap:10px}
.toast.show{display:flex;animation:toast-in .22s ease-out}
.toast .spinner{width:14px;height:14px;flex:none}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,14px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .spinner,.btn.busy::after{animation:spin 1.6s linear infinite!important}
}
</style>
</head>
<body>
<div class="top" id="top">
  <button class="orb gone" id="backBtn" type="button" aria-label="Back to the start" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <nav class="dots gone" id="dots" aria-label="The three aartis"></nav>
  <button class="orb gone" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="screen" aria-live="polite"></main>
<div class="veil" id="veil" aria-hidden="true"></div>
<div class="swipe-arrow" id="swipeArrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" popover="manual"></div>
<audio id="player" preload="none"></audio>

<script src="core.js?v=3"></script>
<script src="aartis.js?v=3"></script>
<script src="bell.js?v=3"></script>
<script>
(() => {
'use strict';
/* ---------- Settings you may change ---------- */
const PIN = '1008';                    // the PIN friends type in; the shared link carries it
const RELEASE = 3;

const C = window.Core;
const AARTIS = window.AartiData.AARTIS;
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const platform = isAndroid ? 'android' : isIOS ? 'ios' : 'other';
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Storage ---------- */
const P = 'aar.';
const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };

// Each room's background colour, for the phone's status bar
const ROOM_BG = { night: '#0E0B14', ganesh: '#1B0F05', lakshmi: '#1E070D', jagdish: '#08122B' };
const LIT_FOR = 8 * 3600e3;            // the diya stays lit for the evening

const S = {
  set: Object.assign({ mode: 'rom', size: 'standard', bell: true }, get('settings', {})),
  unlocked: !!get('ok', false),
  own: get('own', {}),
  litAt: get('litAt', 0),
  route: { r: 'home' },
  installEvt: null,
  cur: null,            // which recording is loaded in the player: 'a:<id>' or 'bell'
  castAvail: null,
  wake: null,
};
delete S.set.theme;
const saveSet = () => put('settings', S.set);
const isLit = () => Date.now() - S.litAt < LIT_FOR;

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = (id) => AARTIS.find((a) => a.id === id);
const appUrl = () => location.origin + location.pathname;
const timesWord = (x) => ({ 2: 'twice', 3: 'three times', 4: 'four times' }[x] || `${x} times`);

const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  cast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M3 12.5a6.5 6.5 0 0 1 6.5 6.5M3 16a3 3 0 0 1 3 3"/><circle cx="3.6" cy="18.6" r=".9" fill="currentColor" stroke="none"/></svg>',
  airplay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 17H4.5A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5h-2"/><path d="M12 14.5l4.5 5h-9z" fill="currentColor"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c2.6 4 4.6 7.3 3.6 10.6-.6 2-2 3.4-3.6 3.4s-3-1.4-3.6-3.4C7.4 9.8 9.4 6.5 12 2.5Z"/><path d="M4 16.5c.6 3 3.9 5 8 5s7.4-2 8-5Z" opacity=".55"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
  chevDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
};

/* ---------- The diya ---------- */
let diyaN = 0;
function diyaSvg(lit, cls, rangoli) {
  const n = ++diyaN;
  const petals = rangoli ? Array.from({ length: 12 }, (_, i) => `<ellipse class="petal" cx="100" cy="14" rx="3" ry="6" transform="rotate(${i * 30} 100 100)"/>`).join('') : '';
  return `<svg class="diya ${lit ? 'lit' : ''} ${cls || ''}" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="dg${n}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F7C46A" stop-opacity=".5"/><stop offset=".45" stop-color="#F2A54A" stop-opacity=".16"/><stop offset="1" stop-color="#F2A54A" stop-opacity="0"/></radialGradient>
      <linearGradient id="dc${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DE8C45"/><stop offset="1" stop-color="#8A4120"/></linearGradient>
      <linearGradient id="df${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC75A"/><stop offset=".7" stop-color="#F59A36"/><stop offset="1" stop-color="#E8702A"/></linearGradient>
    </defs>
    ${rangoli ? `<g class="rangoli"><circle class="dots" cx="100" cy="100" r="96"/><circle class="ring" cx="100" cy="100" r="78"/>${petals}</g>` : ''}
    <circle class="invite" cx="100" cy="112" r="70"/>
    <circle class="glow" cx="100" cy="94" r="84" fill="url(#dg${n})"/>
    <g class="flame-g"><g class="flame">
      <path d="M100 48 C113 70 122 91 115 106 C110 116 90 116 85 106 C78 91 87 70 100 48 Z" fill="url(#df${n})"/>
      <path d="M100 72 C107 86 110 98 106 106 C103 111 97 111 94 106 C90 98 93 86 100 72 Z" fill="#FFF1C9"/>
    </g></g>
    <path d="M38 120 C42 150 70 162 100 162 C130 162 158 150 162 120 Z" fill="url(#dc${n})"/>
    <ellipse cx="100" cy="120" rx="62" ry="9" fill="#5C2812"/>
    <ellipse cx="100" cy="120" rx="62" ry="9" fill="none" stroke="#EDA35C" stroke-width="2.4"/>
    <g fill="#F2B172" opacity=".85"><circle cx="64" cy="139" r="2.6"/><circle cx="82" cy="145" r="2.6"/><circle cx="100" cy="147" r="2.6"/><circle cx="118" cy="145" r="2.6"/><circle cx="136" cy="139" r="2.6"/></g>
    <path d="M100 119 V110" stroke="#2A1206" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- Toast (a popover, so it shows above sheets) ---------- */
let toastTimer;
function toast(msg, busy) {
  const t = $('#toast');
  t.innerHTML = (busy ? '<span class="spinner" aria-hidden="true"></span>' : '') + `<span>${esc(msg)}</span>`;
  try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch {}
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer);
  if (!busy) toastTimer = setTimeout(() => { t.classList.remove('show'); try { t.hidePopover(); } catch {} }, Math.max(2600, msg.length * 55));
}

/* ---------- Rooms and their colours ---------- */
function setRoom(id) {
  const room = ROOM_BG[id] ? id : 'night';
  if (room === 'night') delete document.documentElement.dataset.room; else document.documentElement.dataset.room = room;
  document.querySelector('meta[name=theme-color]').setAttribute('content', ROOM_BG[room]);
}
function setSize(sz) {
  S.set.size = sz; saveSet();
  if (sz === 'standard') delete document.documentElement.dataset.size; else document.documentElement.dataset.size = sz;
}

/* ---------- Sparks, embers and petals ---------- */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, parts = [], raf = 0, ambient = 0, petals = false, lastEmber = 0, lastPetal = 0, col = { sun: '#F2B65A', tint: '#E27B3C' };
  const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); };
  size(); addEventListener('resize', size);
  const colours = () => { const cs = getComputedStyle(document.documentElement); col = { sun: cs.getPropertyValue('--sun').trim() || col.sun, tint: cs.getPropertyValue('--tint').trim() || col.tint }; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  function spark(x, y, o) {
    parts.push(Object.assign({ k: 'spark', x, y, vx: rnd(-.6, .6), vy: rnd(-1.6, -.4), r: rnd(1, 2.4), life: 0, max: rnd(50, 95), c: Math.random() < .7 ? col.sun : col.tint }, o || {}));
  }
  function burst(x, y, n) {
    if (reduced()) return;
    colours();
    for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), s = rnd(.4, 2.6); spark(x, y, { vx: Math.cos(a) * s * .7, vy: Math.sin(a) * s * .7 - 1.1 }); }
    start();
  }
  function step(t) {
    raf = 0;
    if (document.hidden) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (ambient && t - lastEmber > 900 / ambient) {
      lastEmber = t; colours();
      spark(rnd(0, W), H + 6, { k: 'ember', vx: rnd(-.15, .15), vy: rnd(-.55, -.25), r: rnd(.8, 1.8), max: rnd(420, 620), a: rnd(.25, .55) });
    }
    if (petals && t - lastPetal > 340) {
      lastPetal = t;
      parts.push({ k: 'petal', x: rnd(-10, W + 10), y: -14, vx: rnd(-.3, .3), vy: rnd(.6, 1.3), r: rnd(4, 7), rot: rnd(0, 6.3), vr: rnd(-.03, .03), life: 0, max: 900,
        c: ['#F7A21B', '#F4C430', '#E86A17', '#FFB347'][Math.floor(rnd(0, 4))] });
    }
    ctx.globalCompositeOperation = 'lighter';
    const next = [];
    for (const p of parts) {
      p.life++;
      if (p.life > p.max || p.y < -20 || p.y > H + 30) continue;
      next.push(p);
      if (p.k === 'petal') {
        p.x += p.vx + Math.sin((p.life + p.r * 30) / 40) * .45; p.y += p.vy; p.rot += p.vr;
        ctx.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = .85; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.globalCompositeOperation = 'lighter';
        continue;
      }
      p.x += p.vx + (p.k === 'ember' ? Math.sin((p.life + p.x) / 60) * .25 : 0); p.y += p.vy;
      if (p.k === 'spark') { p.vx *= .985; p.vy = p.vy * .985 - .012; }
      const f = 1 - p.life / p.max, a = (p.a || .9) * (p.k === 'ember' ? Math.sin(Math.PI * Math.min(1, p.life / p.max)) : f);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, p.c); g.addColorStop(1, 'transparent');
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    parts = next;
    if (parts.length || ambient || petals) start();
  }
  function start() { if (!raf && !reduced() && !document.hidden) raf = requestAnimationFrame(step); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  return {
    burst,
    mood(a, p) { ambient = reduced() ? 0 : a; petals = !reduced() && !!p; if (!ambient && !petals && !parts.length) ctx.clearRect(0, 0, W, H); start(); },
    count: () => parts.length,
  };
})();

/* ---------- The bell, when the diya is lit ---------- */
let AC = null;
function ringBell() {
  if (S.set.bell === false || !window.Bell) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    window.Bell.ring(AC, AC.destination);
    document.body.dataset.bells = String((+document.body.dataset.bells || 0) + 1);
  } catch {}
}

/* ---------- The painting moves gently with the phone (Android) ---------- */
const TILT = { tx: 0, ty: 0, x: 0, y: 0, base: null, raf: 0 };
window.addEventListener('deviceorientation', (e) => {
  if (S.route.r !== 'aarti' || reduced() || typeof e.gamma !== 'number' || typeof e.beta !== 'number') return;
  if (TILT.base == null) TILT.base = e.beta;
  TILT.tx = Math.max(-1, Math.min(1, e.gamma / 30)) * -12;
  TILT.ty = Math.max(-1, Math.min(1, (e.beta - TILT.base) / 30)) * -10;
  if (!TILT.raf) TILT.raf = requestAnimationFrame(tiltStep);
});
function tiltStep() {
  TILT.raf = 0;
  TILT.x += (TILT.tx - TILT.x) * .08; TILT.y += (TILT.ty - TILT.y) * .08;
  const m = $('.art-move');
  if (m) { m.style.setProperty('--tx', TILT.x.toFixed(2) + 'px'); m.style.setProperty('--ty', TILT.y.toFixed(2) + 'px'); }
  if (Math.abs(TILT.tx - TILT.x) > .05 || Math.abs(TILT.ty - TILT.y) > .05) TILT.raf = requestAnimationFrame(tiltStep);
}

/* ---------- Routes and back ---------- */
let navigating = false;
function go(route, replace) {
  // ignore a second tap while the screen is already changing, or a tap on where you already are
  if (navigating || (route.r === S.route.r && route.id === S.route.id)) return;
  const prev = replace ? (history.state && history.state.prev) || 'home' : (S.route.r === 'home' ? 'home' : (history.state && history.state.prev) || 'home');
  const st = { ...route, prev };
  if (replace) history.replaceState(st, ''); else history.pushState(st, '');
  S.route = route;
  // a soft veil in the next room's colour while the screen changes
  const v = $('#veil');
  if (reduced()) { render(true); return; }
  navigating = true;
  v.classList.add('on');
  setTimeout(() => { navigating = false; render(true); requestAnimationFrame(() => requestAnimationFrame(() => v.classList.remove('on'))); }, 280);
}
// Back always goes up one level: an aarti or the closing screen goes to the start.
function up() {
  return new Promise((res) => {
    if (S.route.r === 'home') { res(); return; }
    if (history.state && history.state.prev === 'home' && history.length > 1) {
      let done = false;
      const fin = () => { if (done) return; done = true; window.removeEventListener('popstate', fin); setTimeout(res, 0); };
      window.addEventListener('popstate', fin);
      setTimeout(() => { if (!done) { S.route = { r: 'home' }; history.replaceState({ r: 'home' }, ''); render(true); fin(); } }, 400);
      history.back();
    } else {
      history.replaceState({ r: 'home' }, '');
      S.route = { r: 'home' };
      render(true);
      res();
    }
  });
}
window.addEventListener('popstate', (e) => {
  const st = e.state && e.state.r ? e.state : { r: 'home' };
  S.route = st.r === 'aarti' ? { r: 'aarti', id: st.id } : { r: st.r };
  render(true);
});

/* ---------- Screens ---------- */
function render(newScreen) {
  const back = $('#backBtn'), dots = $('#dots'), settings = $('#settingsBtn');
  settings.classList.toggle('gone', !S.unlocked);
  const r = S.route;
  if (!S.unlocked) {
    back.classList.add('gone'); dots.classList.add('gone'); setRoom('night');
    $('#screen').innerHTML = lockHtml(); FX.mood(.5, false); return;
  }
  const a = r.r === 'aarti' && byId(r.id);
  back.classList.toggle('gone', !(a || r.r === 'done'));
  dots.classList.toggle('gone', !a);
  if (a) {
    const i = AARTIS.indexOf(a);
    setRoom(a.id);
    dots.innerHTML = AARTIS.map((x, j) => `<button class="dot" type="button" data-jump="${x.id}" aria-label="${esc(x.title)}, ${j + 1} of ${AARTIS.length}" aria-current="${j === i}"></button>`).join('');
    $('#screen').innerHTML = roomHtml(a, i);
    const img = $('.art-img');
    const ready = () => img.classList.add('ready');
    if (img.complete && img.naturalWidth) ready(); else img.addEventListener('load', ready, { once: true });
    const nx = AARTIS[i + 1]; if (nx) { const pre = new Image(); pre.src = nx.art; }
    prepPlayer(a);
    FX.mood(.6, false);
  } else if (r.r === 'done') {
    setRoom('night');
    $('#screen').innerHTML = doneHtml();
    FX.mood(.4, true);
  } else {
    S.route = { r: 'home' };
    setRoom('night');
    $('#screen').innerHTML = homeHtml();
    renderNotices();
    FX.mood(isLit() ? .8 : .35, false);
  }
  syncPlayers();
  keepAwake();
  if (newScreen) { window.scrollTo(0, 0); S.lastY = 0; }
  onScroll();
}

function lockHtml() {
  return `<section class="stage">
    <div class="diya-btn">${diyaSvg(false, '', true)}</div>
    <h1 class="stage-title">Welcome</h1>
    <p class="stage-lead">Aarti is shared with a few friends for Diwali. Enter the PIN to begin.</p>
    <form id="pinForm" autocomplete="off" novalidate>
      <label class="vh" for="pinIn">PIN</label>
      <input class="pin-field num" id="pinIn" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" enterkeyhint="go" placeholder="····">
      <p class="form-note" id="pinNote" role="alert"></p>
      <div class="actions" style="justify-content:center"><button class="btn primary" type="submit">Open Aarti</button></div>
    </form>
  </section>`;
}

const LIT_LEAD = 'The diya is lit. Three aartis, sung in turn: Ganesh, then Lakshmi, then Om Jai Jagdish Hare.';
function homeHtml() {
  const lit = isLit();

function srcFor(a) { return C.sourceFor(a, S.own[a.id]); }

function playCardHtml(a) {
  const s = srcFor(a);
  if (s.kind === 'file') {
    return `<section class="play-card glass" aria-label="Recording">${playerHtml('a:' + a.id, s.url, a.title, a.artist, a.art)}

  }
  const t = C.openTarget(s.src, platform);
  const attrs = spotifyAttrs(t);
  const src = s.own
    ? `<span class="own-tag">Your own version</span><button class="link-btn" type="button" data-own="${a.id}">Change</button>`
    : `${esc(a.artist)}<button class="link-btn" type="button" data-own="${a.id}">Use your own version</button>`;

    <p class="play-note">Opens the song in your Spotify app. Come back here to follow the words.</p>
    <p class="play-src">${src}</p></section>`;
}
const spotifyAttrs = (t) => `href="${esc(t.href)}"${t.newTab ? ' target="_blank" rel="noopener"' : ''}${t.fallback ? ` data-fallback="${esc(t.fallback)}"` : ''}`;

function playerHtml(key, url, title, sub, art, mini) {
  const castIcon = isIOS ? ICON.airplay : ICON.cast;
  const data = `data-key="${esc(key)}" data-url="${esc(url)}" data-title="${esc(title)}" data-sub="${esc(sub || '')}" data-art="${esc(art || 'icon-512.png')}"`;
  const playBtn = `<button class="round-btn" type="button" data-play="${esc(key)}" aria-label="Play ${esc(title)}" title="Play">${ICON.play}</button>`;
  const castBtn = `<button class="icon-btn cast" type="button" data-cast="${esc(key)}" hidden aria-pressed="false" aria-label="Play on a speaker or TV" title="Play on a speaker or TV">${castIcon}</button>`;
  if (mini) return `<div class="player mini" ${data}>${playBtn}${castBtn}</div>`;
  return `<div class="player" ${data}>${playBtn}
    <div class="pl-mid"><div class="pl-title">${esc(title)}</div>
      <input class="seek" type="range" min="0" max="100" step="1" value="0" aria-label="Position in ${esc(title)}" data-seek="${esc(key)}">
      <div class="pl-time num" aria-hidden="true">0:00</div></div>${castBtn}</div>`;
}

function lineHtml(ln, mode, extra) {
  const t = C.lineText(ln, mode);
  const lang = mode === 'dev' ? 'hi' : mode === 'en' ? 'en-GB' : 'hi-Latn';
  const x = ln.x ? `<span class="x num" aria-label="sung ${timesWord(ln.x)}">×${ln.x}</span>` : '';
  const sub = t.sub ? `<span class="sub" lang="hi-Latn">${esc(t.sub)}</span>` : '';
  return `<p class="ln${ln.echo ? ' echo' : ''}${extra ? ' ' + extra : ''}"><span class="main" lang="${lang}">${esc(t.main)}</span>${x}${sub}</p>`;
}
function wordsHtml(a) {
  const mode = S.set.mode;
  return C.blocks(a).map((b) => {
    if (b.type === 'refrain') {
      return `<div class="block refrain"><p class="block-tag">Refrain${b.x > 1 ? `, sung ${timesWord(b.x)}` : ''}</p>${b.lines.map((ln) => lineHtml(ln, mode)).join('')}</div>`;
    }
    return `<div class="block verse">${b.lines.map((ln) => lineHtml(ln, mode)).join('')}${b.cue ? lineHtml(b.cue, mode, 'cue') : ''}</div>`;
  }).join('');
}

/* ---------- Scrolling in a room: the painting softens, the verse in view glows, the dock tucks away ---------- */
let scrollRaf = 0;
function onScroll() {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    const scr = $('#screen');
    if (S.route.r !== 'aarti') { scr.style.removeProperty('--dim'); scr.style.removeProperty('--hint'); return; }
    const y = window.scrollY, vh = innerHeight;
    scr.style.setProperty('--dim', Math.min(1, Math.max(0, (y - vh * .12) / (vh * .6))).toFixed(3));
    scr.style.setProperty('--hint', Math.min(1, Math.max(0, y / (vh * .5))).toFixed(3));
    const mid = vh * .45, blocks = document.querySelectorAll('.words .block');
    let best = null, bd = 1e9;
    blocks.forEach((b) => {
      const r = b.getBoundingClientRect(), c = r.top + r.height / 2, d = Math.abs(c - mid);
      b.style.setProperty('--o', (1 - Math.min(1, d / (vh * .55)) * .62).toFixed(3));
      if (d < bd) { bd = d; best = b; }
    });
    blocks.forEach((b) => b.classList.toggle('now', b === best));
    if (best) best.style.setProperty('--o', '1');
    const dock = $('#dock');
    if (dock) {
      const dy = y - (S.lastY || 0), nearEnd = y + vh > document.documentElement.scrollHeight - 80;
      if (Math.abs(dy) > 6 || nearEnd) {
        dock.classList.toggle('away', dy > 0 && y > vh * .5 && !nearEnd);
        S.lastY = y;
      }
    }
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);

/* ---------- Audio: recordings and the test bell ---------- */
const audio = $('#player');
const abs = (u) => new URL(u, location.href).href;
function prepPlayer(a) {
  const s = srcFor(a);
  // Load the recording's details early so the cast button knows if a speaker is available
  if (s.kind === 'file' && !S.cur && !audio.src) { audio.preload = 'metadata'; load('a:' + a.id, s.url, a.title, a.artist, a.art); }
}
function load(key, url, title, sub, art) {
  if (S.cur === key) return;
  audio.pause();
  S.cur = key;
  audio.src = url;
  audio.load();
  S.meta = { title, sub, art };
  watchCast();
}
function setMedia() {
  if (!('mediaSession' in navigator) || !S.meta) return;
  try {
    const art = S.meta.art && S.meta.art !== 'icon-512.png'
      ? [{ src: S.meta.art, sizes: '1024x1536', type: 'image/jpeg' }, { src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
      : [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }, { src: 'icon-192.png', sizes: '192x192', type: 'image/png' }];
    navigator.mediaSession.metadata = new MediaMetadata({ title: S.meta.title, artist: S.meta.sub || 'Aarti', album: 'Diwali aarti', artwork: art });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('seekto', (d) => { if (d && isFinite(d.seekTime)) audio.currentTime = d.seekTime; });
  } catch {}
}

/* ---------- Google Cast (Chrome on Android and computers) ----------
   The app tells the TV exactly what to play, with its name and the diya, and hears back how it's going.
   If Google's library can't load, the browser's own casting is used instead, and AirPlay on iPhone. */
const CAST_LIB = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
let CAF = null;
function loadCastLib() {
  if (isIOS) return;
  window.__onGCastApiAvailable = (ok) => { if (ok) { try { initCaf(); } catch { CAF = null; } } };
  const el = document.createElement('script');
  el.src = CAST_LIB; el.async = true;
  document.head.append(el);
}
function initCaf() {
  const F = window.cast.framework;   // "cast" alone is our own cast-button function
  const ctx = F.CastContext.getInstance();
  ctx.setOptions({ receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
  const player = new F.RemotePlayer(), ctrl = new F.RemotePlayerController(player);
  CAF = { F, ctx, player, ctrl, loading: null, last: null };
  const avail = (st) => { S.castAvail = st !== F.CastState.NO_DEVICES_AVAILABLE; };
  avail(ctx.getCastState());
  ctx.addEventListener(F.CastContextEventType.CAST_STATE_CHANGED, (e) => { avail(e.castState); syncPlayers(); });
  ctx.addEventListener(F.CastContextEventType.SESSION_STATE_CHANGED, onCafSession);
  ctrl.addEventListener(F.RemotePlayerEventType.ANY_CHANGE, () => {
    const k = remoteKey();
    if (k) CAF.last = { key: k, t: player.currentTime || 0 };
    syncPlayers();
  });
  try { audio.disableRemotePlayback = true; } catch {}   // our cast button does it, so Chrome's own doesn't compete
  castNote('');
  syncPlayers();
}
const cafOn = () => !!(CAF && CAF.player.isConnected);
function castName() {
  try { return CAF.ctx.getCurrentSession().getCastDevice().friendlyName || 'your speaker'; } catch { return 'your speaker'; }
}
// Which of the app's sounds is on the TV right now, if any
function remoteKey() {
  if (!cafOn() || !CAF.player.isMediaLoaded || !CAF.player.mediaInfo) return null;
  const id = CAF.player.mediaInfo.contentId;
  const el = [...document.querySelectorAll('.player')].find((x) => abs(x.dataset.url) === id);
  if (el) return el.dataset.key;
  if (abs('test-bell.mp3') === id) return 'bell';
  const a = AARTIS.find((x) => x.audio && abs(x.audio) === id);
  return a ? 'a:' + a.id : null;
}
function onCafSession(e) {
  const SS = CAF.F.SessionState;
  if (e.sessionState === SS.SESSION_STARTING) toast('Connecting…', true);
  else if (e.sessionState === SS.SESSION_START_FAILED) {
    const m = 'Couldn’t connect. Check the speaker or TV is on, and on the same Wi-Fi as this phone.';
    toast(m); castNote(m);
  } else if (e.sessionState === SS.SESSION_ENDED) {
    // pick up on this phone where the TV got to, paused
    const L = CAF.last;
    if (L && L.key === S.cur && isFinite(audio.duration)) { try { audio.currentTime = Math.min(L.t, audio.duration); } catch {} }
    CAF.last = null; CAF.loading = null;
    toast('Stopped casting'); castNote('');
  }
  syncPlayers();
}
async function cafLoad(p) {
  const sess = CAF.ctx.getCurrentSession();
  if (!sess) return;
  const key = p.dataset.key, title = p.dataset.title, name = castName();
  const from = S.cur === key && isFinite(audio.currentTime) && !audio.ended ? audio.currentTime : 0;
  if (!audio.paused) audio.pause();             // the TV takes over
  const mi = new chrome.cast.media.MediaInfo(abs(p.dataset.url), C.mimeFor(p.dataset.url));
  mi.streamType = chrome.cast.media.StreamType.BUFFERED;
  const md = new chrome.cast.media.MusicTrackMediaMetadata();
  md.title = title; md.artist = p.dataset.sub || 'Aarti'; md.albumName = 'Diwali aarti';
  md.images = [new chrome.cast.Image(abs(p.dataset.art || 'icon-512.png'))];
  mi.metadata = md;
  const req = new chrome.cast.media.LoadRequest(mi);
  req.autoplay = true; req.currentTime = from;
  CAF.loading = key; syncPlayers();
  toast(`Sending ${title} to ${name}…`, true);
  try {
    const err = await sess.loadMedia(req);
    if (err) throw err;
    toast(`Playing on ${name}`);
    castNote(`Connected. ${title} is playing on ${name}.`);
  } catch {
    const m = `${name} couldn’t play ${title}. Try again, or play it on this phone.`;
    toast(m); castNote(m);
  }
  CAF.loading = null; syncPlayers();
}
async function cafCast(p) {
  if (cafOn() && remoteKey() === p.dataset.key) {   // already on the TV: Chrome's own panel offers Stop casting
    try { await CAF.ctx.requestSession(); } catch {}
    return;
  }
  if (!cafOn()) {
    try { await CAF.ctx.requestSession(); }
    catch (err) {
      const m = err === 'cancel' ? '' : err === 'receiver_unavailable' ? 'No speakers or TVs found. Check they’re on the same Wi-Fi as this phone.'
        : err === 'timeout' ? 'The speaker didn’t answer in time. Try again.' : 'Couldn’t start casting. Try again.';
      if (m) { toast(m); castNote(m); }
      return;
    }
    if (!cafOn()) return;
  }
  await cafLoad(p);
}

async function togglePlay(el) {
  const p = el.closest('.player');
  const key = p.dataset.key;
  if (cafOn()) {                                   // while casting, play and pause happen on the TV
    if (remoteKey() === key) CAF.ctrl.playOrPause(); else await cafLoad(p);
    return;
  }
  if (S.cur !== key) load(key, p.dataset.url, p.dataset.title, p.dataset.sub, p.dataset.art);
  if (audio.paused) {
    S.waiting = true; syncPlayers();
    try { await audio.play(); setMedia(); }
    catch (err) {
      S.waiting = false; syncPlayers();
      if (err && err.name === 'NotAllowedError') toast('Tap play again to start the sound.');
      else toast('Couldn’t play the recording. Check your connection.');
    }
  } else audio.pause();
}
function syncPlayers() {
  const rk = remoteKey(), cafConn = cafOn();
  const localPlaying = !audio.paused && !audio.ended;
  const castOn = cafConn || !!(audio.remote && audio.remote.state === 'connected');
  document.querySelectorAll('.player').forEach((p) => {
    const key = p.dataset.key, onTv = rk === key, mine = key === S.cur;
    const btn = p.querySelector('[data-play]'), seek = p.querySelector('.seek'), time = p.querySelector('.pl-time'), cast = p.querySelector('[data-cast]');
    let playing, busy, dur, at;
    if (onTv) {
      const R = CAF.player;
      playing = !R.isPaused && R.playerState !== 'IDLE';
      busy = R.playerState === 'BUFFERING' || CAF.loading === key;
      dur = R.duration || 0; at = R.currentTime || 0;
    } else {
      playing = mine && localPlaying;
      busy = !!(CAF && CAF.loading === key) || (mine && S.waiting && !castOn);
      dur = mine && isFinite(audio.duration) ? audio.duration : 0; at = mine ? audio.currentTime || 0 : 0;
    }
    const state = busy ? 'busy' : playing ? 'pause' : 'play';
    if (btn.dataset.state !== state) {
      btn.dataset.state = state;
      btn.innerHTML = busy ? '<span class="spinner" aria-hidden="true"></span>' : playing ? ICON.pause : ICON.play;
      btn.setAttribute('aria-label', `${playing ? 'Pause' : 'Play'} ${p.dataset.title}${onTv ? ' on ' + castName() : ''}`);
      btn.title = playing ? 'Pause' : 'Play';
    }
    if (seek && (!S.seeking || S.seeking !== seek)) {
      seek.max = String(Math.max(1, Math.round(dur)));
      seek.value = String(Math.round(at));
      seek.style.setProperty('--p', dur ? `${(at / dur) * 100}%` : '0%');
    }
    if (time) time.textContent = dur ? `${C.fmtTime(at)} / ${C.fmtTime(dur)}` : C.fmtTime(at);
    const canCast = CAF ? S.castAvail !== false : !!(audio.remote || audio.webkitShowPlaybackTargetPicker) && S.castAvail !== false;
    if (!cast) return;
    cast.hidden = !canCast;
    const pressed = CAF ? cafConn && (onTv || !rk) : mine && castOn;
    cast.setAttribute('aria-pressed', String(pressed));
    cast.setAttribute('aria-label', pressed ? `Casting to ${CAF ? castName() : 'your speaker or TV'}. Change or stop` : 'Play on a speaker or TV');
  });
}
['play', 'pause', 'playing', 'timeupdate', 'durationchange', 'loadedmetadata', 'ended', 'emptied'].forEach((ev) => audio.addEventListener(ev, () => {
  if (ev === 'playing' || ev === 'pause' || ev === 'ended') S.waiting = false;
  syncPlayers();
}));
audio.addEventListener('waiting', () => { if (!audio.paused) { S.waiting = true; syncPlayers(); } });
audio.addEventListener('error', () => { S.waiting = false; syncPlayers(); if (S.cur) toast('Couldn’t load the recording. Check your connection.'); });

// The browser's own casting: used when Google's library isn't available, and for AirPlay on iPhone
let castWatching = false;
function watchCast() {
  if (castWatching || CAF) return;
  if (audio.remote) {
    castWatching = true;
    audio.remote.watchAvailability((avail) => { if (!CAF) { S.castAvail = avail; syncPlayers(); } })
      .catch(() => { if (!CAF) { S.castAvail = null; syncPlayers(); } });   // can't watch here: show the button and let a tap try
    audio.remote.addEventListener('connect', () => { if (CAF) return; syncPlayers(); toast('Playing on your speaker or TV'); castNote('Connected. The sound should now play on your speaker or TV.'); });
    audio.remote.addEventListener('disconnect', () => { if (CAF) return; syncPlayers(); castNote(''); });
    audio.remote.addEventListener('connecting', () => { if (!CAF) toast('Connecting to your speaker or TV…', true); });
  } else if (audio.webkitShowPlaybackTargetPicker) {
    castWatching = true;
    audio.addEventListener('webkitplaybacktargetavailabilitychanged', (e) => { S.castAvail = e.availability === 'available'; syncPlayers(); });
  }
}
function castNote(msg) { const r = $('#castResult'); if (r) r.textContent = msg; }
async function cast(el) {
  const p = el.closest('.player');
  if (CAF) { await cafCast(p); return; }
  if (S.cur !== p.dataset.key) load(p.dataset.key, p.dataset.url, p.dataset.title, p.dataset.sub, p.dataset.art);
  if (audio.remote) {
    try { await audio.remote.prompt(); }
    catch (err) {
      const n = err && err.name;
      const msg = n === 'NotFoundError' ? 'No speakers or TVs found. Check they’re on the same Wi-Fi as this phone.'
        : n === 'NotSupportedError' ? 'This browser can’t send this sound to a speaker. Try Chrome on Android.'
        : n === 'InvalidStateError' ? 'Already choosing a speaker. Finish that first.'
        : n === 'NotAllowedError' || n === 'AbortError' ? ''
        : 'Couldn’t start casting. Try again.';
      if (msg) { toast(msg); castNote(msg); }
    }
  } else if (audio.webkitShowPlaybackTargetPicker) {
    audio.webkitShowPlaybackTargetPicker();
  }
}

/* ---------- Spotify ---------- */
/* ---------- Spotify ---------- */
// iPhone: if the Spotify app doesn't open within a moment, open the song's web page instead
let fbTimer = 0;
function spotifyTapped(a) {
  toast('Opening Spotify…');
  const fb = a.dataset.fallback;
  if (!fb) return;
  clearTimeout(fbTimer);
  const cancel = () => clearTimeout(fbTimer);
  document.addEventListener('visibilitychange', cancel, { once: true });
  window.addEventListener('pagehide', cancel, { once: true });
  window.addEventListener('blur', cancel, { once: true });
  fbTimer = setTimeout(() => { if (document.visibilityState === 'visible') window.open(fb, '_blank', 'noopener'); }, 1600);
}

/* ---------- Keep the screen on during an aarti ---------- */
async function keepAwake() {
  const want = S.unlocked && (S.route.r === 'aarti' || S.route.r === 'done') && document.visibilityState === 'visible';
  if (!want) { if (S.wake) { S.wake.release().catch(() => {}); S.wake = null; } return; }
  if (S.wake && !S.wake.released) return;
  try { if (navigator.wakeLock) S.wake = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ---------- Unlock ---------- */
/* ---------- Unlock ---------- */
function unlock() {
  S.unlocked = true; put('ok', true);
  history.replaceState({ r: 'home' }, '', location.pathname + location.search);
  S.route = { r: 'home' };
  render(true);
}

/* ---------- Lighting the diya ---------- */
function lightDiya(btn) {
  const svg = btn.querySelector('.diya');
  const r = svg.getBoundingClientRect(), fx = r.left + r.width * .5, fy = r.top + r.height * .4;
  ringBell();
  try { navigator.vibrate && navigator.vibrate(18); } catch {}
  if (svg.classList.contains('lit')) { FX.burst(fx, fy, 14); return; }   // already lit: the bell rings again
  S.litAt = Date.now(); put('litAt', S.litAt);
  svg.classList.add('lit', 'lighting');
  setTimeout(() => svg.classList.remove('lighting'), 1200);
  $('#opening').classList.add('is-lit');
  btn.setAttribute('aria-label', 'The diya is lit');
  FX.burst(fx, fy, 34);
  FX.mood(.8, false);
  const pre = new Image(); pre.src = AARTIS[0].art;
  setTimeout(() => {
    const lead = $('#lead'), more = $('#more');
    if (!lead || !more) return;
    lead.textContent = LIT_LEAD;
    const pdf = isIOS || platform === 'other' ? 'target="_blank" rel="noopener"' : 'download="Diwali aartis.pdf"';
    more.innerHTML = moreHtml(pdf, true);
  }, reduced() ? 0 : 700);
}

async function shareApp() {
  const url = `${appUrl()}#pin=${PIN}`;
  const data = { title: 'Aarti', text: 'Diwali aartis to sing together.', url };
  if (navigator.share) {
    try { await navigator.share(data); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Link copied. It opens Aarti without the PIN.'); }
  catch { toast(`Copy this link: ${url}`); }
}

/* ---------- Taps ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, a');
  if (!t) {   // a tap on the words brings the dock back
    const dock = $('#dock');
    if (dock && e.target.closest('.room')) { dock.classList.remove('away'); S.lastY = window.scrollY; }
    return;
  }
  const d = t.dataset;
  if (d.spotify) { spotifyTapped(t); return; }
  if (d.go) { go({ r: 'aarti', id: d.go }); return; }
  if (d.next) { go({ r: 'aarti', id: d.next }, true); return; }
  if (d.jump) { if (S.route.id !== d.jump) go({ r: 'aarti', id: d.jump }, true); return; }
  if (d.mode) {
    S.set.mode = d.mode; saveSet();
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === d.mode)));
    const w = $('#words'), a = byId(S.route.id);
    if (w && a) { w.dataset.mode = d.mode; w.innerHTML = wordsHtml(a); onScroll(); }
    return;
  }
  if (d.size) { t.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === t))); setSize(d.size); toast(`Text size: ${t.textContent.toLowerCase()}`); return; }
  if (d.own) { openOwn(d.own); return; }
  if (d.unown) {
    delete S.own[d.unown]; put('own', S.own);
    closeSheet(); render();
    toast(`Back to the app’s song for ${byId(d.unown).title}`);
    return;
  }
  if (d.play) { togglePlay(t); return; }
  if (d.cast) { cast(t); return; }
  if (d.dismiss) { const x = get('dismissed', {}); x[d.dismiss] = 1; put('dismissed', x); renderNotices(); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'light': lightDiya(t); break;
    case 'finish': go({ r: 'done' }, true); break;
    case 'home': up(); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; renderNotices(); } break;
    case 'share': shareApp(); break;
    case 'bell':
      S.set.bell = S.set.bell === false; saveSet();
      t.setAttribute('aria-checked', String(S.set.bell));
      if (S.set.bell) ringBell();
      break;
  }
});

// A small bloom of sparks wherever you touch
document.addEventListener('pointerdown', (e) => {
  if (!S.unlocked || sheet.open || e.target.closest('input, .seek, [data-act="light"]')) return;
  FX.burst(e.clientX, e.clientY, 9);
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'pinForm') {
    const v = $('#pinIn').value;
    if (C.pinOk(v, PIN)) { unlock(); toast('Welcome. Shubh Deepavali.'); }
    else {
      $('#pinIn').classList.add('bad');
      $('#pinNote').textContent = C.digits(v) ? 'That PIN isn’t right. Check with whoever shared Aarti with you.' : 'Type the PIN first.';
      $('#pinIn').select();
    }
  }
  if (f.id === 'ownForm') {
    const id = f.dataset.id, r = C.parseSpotify($('#ownIn').value);
    if (!r.ok) { $('#ownIn').classList.add('bad'); $('#ownNote').textContent = r.msg; return; }
    S.own[id] = r.kind === 'track' ? { kind: 'track', id: r.id } : { kind: 'short', url: r.url };
    put('own', S.own);
    closeSheet(); render();
    toast(`Your version of ${byId(id).title} is set`);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'pinIn') {
    e.target.classList.remove('bad'); $('#pinNote').textContent = '';
    if (C.pinOk(e.target.value, PIN)) { unlock(); toast('Welcome. Shubh Deepavali.'); }
  }
  if (e.target.id === 'ownIn') { e.target.classList.remove('bad'); $('#ownNote').textContent = ''; }
  if (e.target.dataset.seek) {
    const key = e.target.dataset.seek;
    if (cafOn() && remoteKey() === key) return;    // the TV is told once you let go (change)
    if (key === S.cur && isFinite(audio.duration)) { audio.currentTime = +e.target.value; }
  }
});
document.addEventListener('change', (e) => {
  if (!e.target.dataset || !e.target.dataset.seek) return;
  if (cafOn() && remoteKey() === e.target.dataset.seek) { CAF.player.currentTime = +e.target.value; CAF.ctrl.seek(); }
});
document.addEventListener('pointerdown', (e) => { if (e.target.classList && e.target.classList.contains('seek')) S.seeking = e.target; });
document.addEventListener('pointerup', () => { S.seeking = null; });

$('#settingsBtn').addEventListener('click', () => openSettings());
$('#backBtn').addEventListener('click', () => up());

/* ---------- Gestures: swipe right to go up a level, drag a sheet down to close it ---------- */
(function gestures() {
  const scr = $('#screen'), arrow = $('#swipeArrow');
  let g = null;
  const sideScroller = (el) => {
    for (let n = el; n && n !== document.body; n = n.parentElement) {
      if (n.scrollWidth > n.clientWidth + 2) { const ox = getComputedStyle(n).overflowX; if (ox === 'auto' || ox === 'scroll') return true; }
    }
    return false;
  };
  const selecting = () => { const s = window.getSelection && window.getSelection(); return !!(s && String(s).length); };
  document.addEventListener('touchstart', (e) => {
    g = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0], el = e.target;
    if (el.closest('input, textarea, select, [contenteditable], .seek') || sideScroller(el) || selecting()) return;
    if (sheet.open) {
      if (!sheet.contains(el)) return;
      g = { kind: 'sheet', x0: t.clientX, y0: t.clientY, t0: performance.now(), dir: null, grab: !!el.closest('[data-grab]') };
      return;
    }
    if (!S.unlocked || S.route.r === 'home') return;
    if (!standalone && t.clientX < 24) return;   // leave the edge to the browser's own back swipe
    g = { kind: 'screen', x0: t.clientX, y0: t.clientY, t0: performance.now(), dir: null };
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
    if (!g.dir) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) && dx > 0) g.dir = 'right';
      else if (g.kind === 'sheet' && g.grab && dy > 0 && Math.abs(dy) > Math.abs(dx)) g.dir = 'down';
      else { g = null; return; }   // scrolling: let it go
    }
    e.preventDefault();
    g.dx = dx; g.dy = dy;
    const now = performance.now();
    (g.samples = g.samples || []).push([now, g.dir === 'down' ? dy : dx]);
    while (g.samples.length > 2 && now - g.samples[0][0] > 120) g.samples.shift();
    if (reduced()) { if (g.kind === 'screen') arrow.style.opacity = String(Math.min(1, dx / (innerWidth / 3))); return; }
    if (g.kind === 'screen') {
      scr.classList.add('dragging');
      scr.style.transform = `translateX(${Math.max(0, dx)}px)`;
      arrow.style.opacity = String(Math.min(1, dx / (innerWidth / 3)));
    } else if (g.dir === 'right') {
      sheet.style.transform = `translateX(${Math.max(0, dx)}px)`;
    } else {
      sheet.style.transform = `translateY(${Math.max(0, dy)}px)`;
    }
  }, { passive: false });

  const end = async () => {
    if (!g || !g.dir) { g = null; return; }
    const G = g; g = null;
    const dist = G.dir === 'down' ? G.dy || 0 : G.dx || 0;
    // speed over the last tenth of a second or so, so a flick counts even after a slow start
    const sm = G.samples || [], s0 = sm[0], s1 = sm[sm.length - 1];
    const v = s0 && s1 && s1[0] > s0[0] ? (s1[1] - s0[1]) / (s1[0] - s0[0]) : dist / Math.max(1, performance.now() - G.t0);
    const far = G.dir === 'down' ? dist > sheet.offsetHeight / 4 : dist > innerWidth / 3;
    const goes = far || v > 0.5;
    if (G.kind === 'screen') {
      scr.classList.remove('dragging');
      if (!goes) {
        scr.classList.add('springing'); scr.style.transform = 'translateX(0)'; arrow.style.opacity = '0';
        setTimeout(() => { scr.classList.remove('springing'); scr.style.transform = ''; }, 300);
        return;
      }
      if (!reduced()) { scr.classList.add('springing'); scr.style.transform = `translateX(${innerWidth}px)`; await new Promise((r) => setTimeout(r, 200)); }
      await up();
      scr.classList.remove('springing'); scr.style.transform = ''; arrow.style.opacity = '0';
    } else {
      if (!goes) {
        sheet.classList.add('springing'); sheet.style.transform = '';
        setTimeout(() => sheet.classList.remove('springing'), 300);
        return;
      }
      if (!reduced()) {
        sheet.classList.add('springing');
        sheet.style.transform = G.dir === 'down' ? 'translateY(100%)' : `translateX(${innerWidth}px)`;
        await new Promise((r) => setTimeout(r, 200));
      }
      closeSheet();
    }
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
})();

/* ---------- Start ---------- */
(function start() {
  const pin = C.pinFromHash(location.hash);
  if (pin && C.pinOk(pin, PIN)) { S.unlocked = true; put('ok', true); }
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  setSize(S.set.size);
  saveSet();
  history.replaceState({ r: 'home' }, '');
  render(true);
  loadCastLib();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
