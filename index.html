<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aarti</title>
<meta name="description" content="For those of us who always followed Mum’s lead, and anyone on their own this year: the Diwali aarti, word by word.">
<meta name="theme-color" content="#0A100A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aarti">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Colours glide from one aarti to the next */
@property --bg{syntax:'<color>';inherits:true;initial-value:#0A100A}
@property --raise{syntax:'<color>';inherits:true;initial-value:#141B12}
@property --raise-2{syntax:'<color>';inherits:true;initial-value:#1E271A}
@property --ink{syntax:'<color>';inherits:true;initial-value:#F5EDDA}
@property --ink-2{syntax:'<color>';inherits:true;initial-value:#C3B99E}
@property --ink-3{syntax:'<color>';inherits:true;initial-value:#857D63}
@property --sun{syntax:'<color>';inherits:true;initial-value:#F2B65A}
@property --sun-soft{syntax:'<color>';inherits:true;initial-value:rgba(242,182,90,.18)}
@property --on-sun{syntax:'<color>';inherits:true;initial-value:#1F1304}
@property --tint{syntax:'<color>';inherits:true;initial-value:#E27B3C}
@property --glass{syntax:'<color>';inherits:true;initial-value:rgba(12,19,11,.58)}
@property --line{syntax:'<color>';inherits:true;initial-value:rgba(245,237,218,.12)}
:root{
  /* Night: the opening, the PIN and the close, in the deep green of the diya photo with its flame's gold */
  --bg:#0A100A;--raise:#141B12;--raise-2:#1E271A;--ink:#F5EDDA;--ink-2:#C3B99E;--ink-3:#857D63;
  --sun:#F2B65A;--sun-soft:rgba(242,182,90,.18);--on-sun:#1F1304;--tint:#E27B3C;--glass:rgba(12,19,11,.58);--line:rgba(245,237,218,.12);
  --sans:"Hanken Grotesk","Tiro Devanagari Hindi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora","Tiro Devanagari Hindi",Georgia,"Noto Serif Devanagari",serif;
  --deva:"Tiro Devanagari Hindi","Noto Serif Devanagari","Kohinoor Devanagari",serif;
  --ls:21px;color-scheme:dark;
  transition:--bg 1.2s ease,--raise 1.2s ease,--raise-2 1.2s ease,--ink 1.2s ease,--ink-2 1.2s ease,--ink-3 1.2s ease,--sun 1.2s ease,
    --sun-soft 1.2s ease,--on-sun 1.2s ease,--tint 1.2s ease,--glass 1.2s ease,--line 1.2s ease;
}
/* Ganesh: saffron and marigold, with vermilion */
:root[data-room="ganesh"],.peek[data-room="ganesh"]{--bg:#1B0F05;--raise:#2A180A;--raise-2:#38210F;--ink:#FCEEDC;--ink-2:#DABC97;--ink-3:#9A7B5B;
  --sun:#F7AB3C;--sun-soft:rgba(247,171,60,.2);--on-sun:#241302;--tint:#E0532F;--glass:rgba(33,18,6,.6);--line:rgba(252,238,220,.13)}
/* Lakshmi: deep crimson and gold, with lotus pink */
:root[data-room="lakshmi"],.peek[data-room="lakshmi"]{--bg:#1E070D;--raise:#2D0E16;--raise-2:#3B1520;--ink:#FDEDE8;--ink-2:#E2B7B2;--ink-3:#A0716F;
  --sun:#EEC566;--sun-soft:rgba(238,197,102,.2);--on-sun:#2A1704;--tint:#F09DB1;--glass:rgba(36,9,16,.6);--line:rgba(253,237,232,.13)}
/* Jagdish: night-sky blue, with pitambar yellow */
:root[data-room="jagdish"],.peek[data-room="jagdish"]{--bg:#08122B;--raise:#0F1D3D;--raise-2:#17284E;--ink:#EEF2FB;--ink-2:#AEBBD8;--ink-3:#71809F;
  --sun:#F5CA52;--sun-soft:rgba(245,202,82,.2);--on-sun:#201802;--tint:#52B8B4;--glass:rgba(9,20,46,.6);--line:rgba(238,242,251,.13)}
:root[data-size="large"]{--ls:24px} :root[data-size="largest"]{--ls:28px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
[lang="hi"]{font-family:var(--deva)}
.serif{font-family:var(--serif)}

/* Floating top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none}
.top > *{pointer-events:auto}
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);flex:none;transition:opacity .4s}
.orb svg{width:21px;height:21px}
.orb.gone{opacity:0;visibility:hidden}
/* settings stays out of the way: a quiet grey mark, brighter when touched */
#settingsBtn,#faithBtn{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;color:var(--ink-2);filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
#settingsBtn:not(.gone),#faithBtn:not(.gone){opacity:.45}
#settingsBtn:not(.gone):active,#settingsBtn:not(.gone):focus-visible,#faithBtn:not(.gone):active,#faithBtn:not(.gone):focus-visible{opacity:.9}
#settingsBtn svg{width:19px;height:19px}
.dots{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);display:flex;align-items:center;padding:0 3px;border-radius:9px;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dot{width:24px;height:20px;display:grid;place-items:center}
.dot::before{content:"";width:5px;height:5px;border-radius:3px;background:var(--ink-3);transition:width .4s cubic-bezier(.2,.8,.2,1),background .4s}
.dot[aria-current="true"]::before{width:14px;background:var(--sun)}
/* the tilak, top centre: a soft gold mark that glows gently; it opens a reflection */
.tilak{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));width:52px;height:44px;margin-left:-26px;display:grid;place-items:center;
  color:#FFD98A;color:color-mix(in srgb,var(--sun) 72%,#FFF6DC);transition:opacity .4s;-webkit-tap-highlight-color:transparent}
.tilak.gone{opacity:0;visibility:hidden}
.tilak svg{position:relative;width:27px;height:27px;transition:transform .3s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 0 2.5px var(--sun)) drop-shadow(0 0 9px var(--sun-soft)) drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tilak::before{content:"";position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,206,110,.42),rgba(255,190,90,.14) 55%,transparent 74%);opacity:.7;animation:tilak-glow 3.8s ease-in-out infinite}
.tilak::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  box-shadow:0 0 0 1px var(--sun);opacity:0;animation:tilak-ring 7.6s ease-out infinite 1.5s}
@keyframes tilak-glow{50%{opacity:1;transform:scale(1.14)}}
@keyframes tilak-ring{0%{opacity:.55;transform:scale(.7)}22%{opacity:0;transform:scale(1.7)}100%{opacity:0;transform:scale(1.7)}}
.tilak:active svg{transform:scale(.9)}
.tilak.calling svg{animation:tilak-call 1.6s ease-in-out infinite}
.tilak.calling::after{animation:tilak-ring 1.6s ease-out infinite}
@keyframes tilak-call{50%{transform:scale(1.14)}}
/* the spotlight: everything dims but the tilak, with a word of invitation */
@property --spot-r{syntax:'<length>';inherits:false;initial-value:240px}
.spot{position:fixed;inset:0;z-index:35;cursor:pointer;opacity:0;transition:opacity .7s ease;--spot-r:240px;
  background:radial-gradient(circle at var(--sx) var(--sy),transparent 0,transparent calc(var(--spot-r) * .5),rgba(2,3,2,.76) var(--spot-r))}
.spot.on{opacity:1;--spot-r:54px;transition:opacity .7s ease,--spot-r 1.1s cubic-bezier(.16,1,.3,1)}
.spot-say{position:absolute;left:0;right:0;margin:0;text-align:center;font:400 17px var(--serif);font-style:italic;color:#FFF3D6;letter-spacing:.01em;
  text-shadow:0 1px 12px rgba(0,0,0,.6);opacity:0;transform:translateY(6px);transition:opacity .6s ease .45s,transform .8s cubic-bezier(.16,1,.3,1) .45s}
.spot.on .spot-say{opacity:1;transform:none}

.top-left{min-width:44px;height:44px;flex:none;display:flex;align-items:center}
.top-left .orb.gone{display:none}
/* back to the start: a round glass button with a gold arrow, no words */
.orb.back{color:var(--sun);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px rgba(0,0,0,.2)}
.orb.back svg{width:22px;height:22px;filter:drop-shadow(0 0 6px var(--sun-soft));transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.orb.back:active{background:var(--sun-soft)}
.orb.back:active svg{transform:translateX(-3px)}
.orb.faith svg{width:21px;height:21px}
#faithBtn[aria-pressed="true"]{color:var(--sun);opacity:.95}

/* A verse: Daily Drift itself, running untouched in a layer over Aarti. Its colours fill the strips by the notch and home bar. */
.dd-layer{position:fixed;inset:0;z-index:40;opacity:0;transition:opacity .45s ease;
  background:radial-gradient(130% 75% at 50% 0%,var(--dd-bg2,#152036) 0%,var(--dd-bg,#0B101A) 62%)}
.dd-layer.on{opacity:1}
.dd-layer iframe{position:absolute;top:env(safe-area-inset-top);left:env(safe-area-inset-left);border:0;display:block;background:transparent;opacity:0;transition:opacity .5s ease;
  width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.dd-layer.ready iframe{opacity:1}
.dd-layer .drift{position:absolute;left:50%;top:50%;margin:-66px 0 0 -66px;transition:opacity .4s;--sun:#D6E2FF;--sun-soft:rgba(196,214,255,.2);--ink:#F1F5FF}
.dd-layer.ready .drift{opacity:0}
html.drifting,html.drifting body{overflow:hidden}
/* the loader, from Daily Drift: a breathing point of light, ripples leaving it, motes in slow orbit */
.drift{position:relative;width:132px;height:132px;margin:0 auto;transform:scale(.72)}
.drift[hidden]{display:none}
.drift > span{position:absolute;left:50%;top:50%}
.drift .core{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);box-shadow:0 0 18px 4px var(--sun-soft),0 0 46px 14px var(--sun-soft);animation:core-breathe 2.6s ease-in-out infinite}
.drift .ring{width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sun);opacity:0;animation:ripple 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.drift .ring:nth-child(2){animation-delay:1.2s}
.drift .ring:nth-child(3){animation-delay:2.4s}
.drift .orbit{width:0;height:0;animation:orbit 6s linear infinite}
.drift .orbit i{position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--sun);box-shadow:0 0 8px 2px var(--sun-soft)}
.drift .o1 i{transform:translateX(26px)}
.drift .o2{animation-duration:9.5s;animation-direction:reverse}
.drift .o2 i{transform:translateX(40px)}
.drift .o3{animation-duration:14s}
.drift .o3 i{transform:translateX(54px)}
@keyframes core-breathe{50%{transform:scale(1.35);opacity:.8}}
@keyframes ripple{0%{opacity:.55;transform:scale(.1)}100%{opacity:0;transform:scale(1)}}
@keyframes orbit{to{transform:rotate(360deg)}}

/* Moving between screens: a soft veil in the next colour */
.veil{position:fixed;inset:0;z-index:18;pointer-events:none;background:radial-gradient(70% 55% at 50% 45%,var(--sun-soft),var(--bg) 70%);opacity:0;transition:opacity .28s ease}
.veil.on{opacity:1}

/* Sparks, embers and petals */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

#screen{position:relative;overflow-x:clip}
#screen.dragging{will-change:transform}
#screen.springing{transition:transform .28s cubic-bezier(.2,.8,.2,1)}

/* The opening, PIN and closing screens: G's diya photo. Touch it and the light spreads from the wick;
   the flames sway and flicker, the water ripples, the mandala breathes, and it all fades into the page. */
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--hero-h:min(118vw,64svh,700px)}
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0 24px calc(36px + env(safe-area-inset-bottom));position:relative;overflow:hidden;overflow:clip}   /* the glow below the photo never makes the page scroll */
.stage > :not(.hero){position:relative;z-index:2}
.stage::before{content:"";position:absolute;left:0;right:0;top:calc(var(--hero-h) * .6);height:min(90vh,640px);z-index:-1;pointer-events:none;
  background:radial-gradient(60% 46% at 50% 18%,var(--sun-soft),transparent 74%);opacity:0;transition:opacity 2.2s ease}
.stage.is-lit::before{opacity:1}
.hero{position:relative;z-index:0;display:block;flex:none;width:100vw;height:var(--hero-h);overflow:hidden;cursor:default;touch-action:manipulation;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 72%,transparent 100%)}
button.hero{cursor:pointer;border-radius:0}
button.hero:focus-visible{outline:none}
button.hero:focus-visible .wick{opacity:.8}
.hero-move{position:absolute;inset:0}
/* the photo keeps its shape: as tall as the hero, centred on the diya, its sides fading out on wide screens */
.hero-frame{position:absolute;top:0;left:50%;height:100%;aspect-ratio:16/9;transform:translateX(-50%);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.hero-dark,.hero-lit{position:absolute;inset:0}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.water{position:absolute;left:0;top:65.926%;width:100%;height:34.074%;display:block;pointer-events:none}
.hero-lit{opacity:0}
.stage.is-lit .hero-lit{opacity:1}
.stage.is-lit:not(.lighting) .hero-dark{visibility:hidden}
.stage.lighting .hero-lit{animation:reveal 2.6s cubic-bezier(.3,.05,.2,1) .05s both;
  -webkit-mask-image:radial-gradient(circle 60vmax at 49.9% 66%,#000 calc(var(--r) - 24%),transparent var(--r));
  mask-image:radial-gradient(circle 60vmax at 49.9% 66%,#000 calc(var(--r) - 24%),transparent var(--r))}
@keyframes reveal{from{--r:0%;opacity:0}12%{opacity:1}to{--r:132%;opacity:1}}
/* light: soft glows laid over the photo */
.hero i{position:absolute;display:block;border-radius:50%;pointer-events:none;mix-blend-mode:screen;transform:translate(-50%,-50%)}
.wick{left:49.9%;top:69.6%;width:5%;height:9%;background:radial-gradient(closest-side,rgba(255,178,92,.85),rgba(255,140,50,.25) 45%,transparent);opacity:.1;
  animation:wick 3.6s ease-in-out infinite}
@keyframes wick{50%{opacity:.5}}
.halo{left:49.9%;top:63%;width:34%;height:60%;background:radial-gradient(closest-side,rgba(255,198,112,.4),rgba(255,160,64,.15) 46%,transparent);opacity:0}
.stage.is-lit .halo{opacity:.72;animation:halo 2.3s ease-in-out infinite}
.stage.lighting .halo{animation:halo-in 1.2s ease-out both}
.hero.flare .halo{animation:flare 1.1s ease-out}
@keyframes halo{0%,100%{opacity:.72}13%{opacity:.6}27%{opacity:.8}41%{opacity:.65}58%{opacity:.85}72%{opacity:.68}86%{opacity:.78}}
@keyframes halo-in{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}35%{opacity:1}to{opacity:.72;transform:translate(-50%,-50%) scale(1)}}
@keyframes flare{0%{opacity:.72}16%{opacity:1}100%{opacity:.72}}
.mandala{left:50.4%;top:33.8%;width:40%;height:71%;background:radial-gradient(closest-side,rgba(255,192,96,.3),rgba(255,170,70,.1) 55%,transparent);opacity:0}
.stage.is-lit .mandala{animation:mandala 7.5s ease-in-out 2.4s infinite alternate}
@keyframes mandala{from{opacity:0}to{opacity:.6}}
/* the flames, cut from the photo, sway from the wick and flicker */
.flame{position:absolute;display:block;opacity:0}
.flame img{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:inherit}
.fc{left:46.771%;top:56.667%;width:6.25%;height:15.37%;transform-origin:50% 86.75%;--sw:3.7s;--sd:0s;--fl:1.13s;--fd:0s;--id:.05s}
.fl{left:27.917%;top:49.444%;width:4.792%;height:13.148%;transform-origin:50% 78.9%;--sw:4.3s;--sd:-1.4s;--fl:1.37s;--fd:-.5s;--id:.55s}
.fr{left:64.844%;top:50.556%;width:4.792%;height:13.148%;transform-origin:50% 78.9%;--sw:3.9s;--sd:-2.6s;--fl:1.21s;--fd:-.9s;--id:.7s}
.stage.is-lit .flame{opacity:1;animation:sway var(--sw) ease-in-out var(--sd) infinite}
.stage.is-lit .flame img{animation:flick var(--fl) ease-in-out var(--fd) infinite}
.stage.lighting .flame{animation:ignite 1.2s cubic-bezier(.2,.8,.2,1) var(--id) both}
@keyframes ignite{from{opacity:0;transform:scale(.25,.06)}35%{opacity:1}to{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:none}21%{transform:skewX(-2.2deg) scaleY(1.02)}43%{transform:skewX(1.4deg) scaleY(.985)}
  64%{transform:skewX(-.9deg) scaleY(1.03)}82%{transform:skewX(2.4deg) scaleY(.99)}}
@keyframes flick{0%,100%{transform:none;opacity:1}9%{transform:scale(.985,1.03)}17%{transform:scale(1.01,.975);opacity:.93}31%{transform:scale(.99,1.045)}
  38%{transform:scale(1.015,.985);opacity:1}52%{transform:scale(.995,1.02)}61%{transform:scale(1.005,.97);opacity:.91}74%{transform:scale(.985,1.035)}88%{transform:scale(1.01,.99);opacity:1}}
.stage-title{margin:-34px 0 0;font:400 36px/1.12 var(--serif);letter-spacing:-.01em;text-shadow:0 2px 22px rgba(0,0,0,.55)}
.stage-lead{margin:12px auto 0;max-width:21em;font:300 18px/1.55 var(--sans);color:var(--ink-2)}
.stage .notices{margin-top:26px;width:100%}
.more{display:grid;justify-items:center;gap:20px;margin-top:24px;width:100%}
/* Welcome: once per phone, a frosted card in the app's own green and gold, rising from below */
dialog.welcome{position:fixed;inset:auto 0 calc(16px + env(safe-area-inset-bottom)) 0;margin:0 auto;width:calc(100% - 28px);max-width:25rem;
  max-height:calc(100svh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain;
  padding:24px 22px 20px;border:0;border-radius:24px;color:var(--ink);text-align:center;
  background:linear-gradient(180deg,rgba(32,42,27,.88),rgba(13,19,12,.94));-webkit-backdrop-filter:blur(24px) saturate(1.15);backdrop-filter:blur(24px) saturate(1.15);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(245,237,218,.07),0 30px 80px rgba(0,0,0,.6)}
dialog.welcome[open]{animation:w-rise .8s cubic-bezier(.16,1,.3,1) both}
dialog.welcome.settled[open]{animation:none}
dialog.welcome::backdrop{background:radial-gradient(130% 70% at 50% 100%,rgba(3,7,3,.78),rgba(3,7,3,.38));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:w-fade .6s ease both}
dialog.welcome.closing{animation:w-sink .44s cubic-bezier(.5,0,.75,0) both}
dialog.welcome.closing::backdrop{animation:w-fade .44s ease reverse both}
@keyframes w-rise{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes w-sink{to{opacity:0;transform:translateY(28px) scale(.98)}}
@keyframes w-fade{from{opacity:0}}
.welcome .w-in{animation:rise-in .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i) * 70ms + 160ms)}
.welcome.settled .w-in{animation:none}
.welcome .mini-diya{display:block;margin:2px auto 14px}
.welcome h2{margin:0;font:400 31px/1.15 var(--serif);letter-spacing:-.005em;outline:none}
.w-why{margin:12px auto 0;max-width:20em;font:400 16.5px/1.55 var(--serif);color:var(--ink);text-wrap:pretty}
.w-mala{font-size:.95em;white-space:nowrap}
.w-why + .w-lead{margin-top:12px}
.w-lead{margin:8px auto 0;max-width:19em;font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.w-steps{list-style:none;margin:18px 0 0;padding:4px 2px;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.w-steps li{display:flex;align-items:center;gap:13px;padding:10px 4px;font-size:15.5px;line-height:1.35;color:var(--ink)}
.w-steps li + li{border-top:1px solid rgba(245,237,218,.06)}
.w-steps svg{width:19px;height:19px;flex:none;color:var(--sun)}
.w-install{margin:16px auto 0;max-width:21em;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.w-install strong{font-weight:500;color:var(--ink)}
.w-actions{display:flex;gap:10px;margin-top:18px}
.w-actions .btn{flex:1}
.rel{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.owner{margin-top:6px}
.owner .small{margin-bottom:0}
.w-credit{margin:30px 0 0;font:400 12.5px var(--sans);letter-spacing:.06em;color:var(--ink-3);opacity:.75}

/* A reflection: the same frosted card as the welcome, in the colours of the moment, for reading */
dialog.reflect{position:fixed;inset:0;margin:auto;width:calc(100% - 28px);max-width:31rem;height:fit-content;
  max-height:min(calc(100svh - 124px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),720px);padding:0;border:0;border-radius:26px;color:var(--ink);overflow:hidden;
  background:var(--raise);background:linear-gradient(180deg,color-mix(in srgb,var(--raise-2) 92%,transparent),color-mix(in srgb,var(--bg) 96%,transparent));
  -webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.06),0 34px 90px rgba(0,0,0,.62)}
dialog.reflect[open]{display:flex;flex-direction:column;animation:r-in .7s cubic-bezier(.16,1,.3,1) both}
@keyframes r-in{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
dialog.reflect::backdrop{background:radial-gradient(120% 80% at 50% 50%,rgba(0,0,0,.74),rgba(0,0,0,.5));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:w-fade .6s ease both}
dialog.reflect.closing{animation:w-sink .44s cubic-bezier(.5,0,.75,0) both}
dialog.reflect.closing::backdrop{animation:w-fade .44s ease reverse both}
dialog.reflect.dragging{animation:none}
dialog.reflect.dragged{animation:none;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.r-x{position:absolute;top:8px;right:8px;z-index:2;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3);border-radius:12px}
.r-x svg{width:20px;height:20px}
.r-scroll{overflow:auto;overscroll-behavior:contain;padding:50px 28px 30px;text-align:center;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 20px,#000 54px,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to bottom,transparent 0,transparent 20px,#000 54px,#000 calc(100% - 30px),transparent)}
.r-mark{position:relative;width:52px;height:52px;margin:0 auto 10px;display:grid;place-items:center;color:var(--sun)}
.r-mark::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(closest-side,var(--sun-soft),transparent 72%);animation:tilak-glow 4.8s ease-in-out infinite}
.r-mark svg{position:relative;width:30px;height:30px;filter:drop-shadow(0 0 3px var(--sun-soft))}
.r-kicker{margin:0;font:500 11.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.reflect h2{margin:8px auto 0;max-width:14em;font:400 30px/1.15 var(--serif);letter-spacing:-.005em;outline:none;text-wrap:balance}
.r-body{margin:22px auto 0;max-width:31em;text-align:left;font:400 calc(var(--ls,20px) * .88)/1.72 var(--serif);
  color:var(--ink);color:color-mix(in srgb,var(--ink) 88%,var(--ink-2))}
.r-body p{margin:0 0 .95em;text-wrap:pretty}
.r-body p:last-child{margin-bottom:.4em}
.r-body em{font-style:italic;color:var(--sun);color:color-mix(in srgb,var(--sun) 72%,var(--ink))}
.reflect .w-in{animation:rise-in .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(min(var(--i), 6) * 70ms + 160ms)}

/* Lakshmi Puja: the time for your place, an "i" for what the words mean, and the place to tap to change it */
.puja{margin:12px auto 0;display:flex;flex-direction:column;align-items:center}
.puja p{margin:0}
.puja-label{display:flex;align-items:center;gap:2px;font:500 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.puja-label span{padding-left:30px}
.info-btn{width:40px;height:34px;display:grid;place-items:center;color:var(--ink-3);border-radius:10px}
.info-btn svg{width:18px;height:18px}
.info-btn:active{color:var(--ink)}
.puja-time{font:400 24px/1.25 var(--serif);letter-spacing:.005em;color:var(--ink);transition:color .6s,text-shadow .6s}
.puja-time.lit{color:var(--sun);text-shadow:0 0 22px var(--sun-soft)}
.puja-sub{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.place-btn{display:inline-flex;align-items:center;gap:2px;min-height:36px;padding:0 2px 0 4px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.place-btn svg{width:14px;height:14px;opacity:.7}
/* the time, tucked in the corner: tap it to change place */
.top-right{position:relative;display:flex;align-items:center}
/* the opening is snug, so it all fits on the screen without scrolling (the photo gives up the rest: fitHome) */
#opening{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#opening .puja{margin-top:6px}
#opening .stage-lead{margin-top:8px;font-size:16px;line-height:1.5;max-width:23em}
#opening .more{gap:12px;margin-top:14px}
#opening .gallery{gap:8px}
#opening .tile{aspect-ratio:4/5}
@media (max-height:760px){ #opening .tile{aspect-ratio:1} #opening .tile img{object-position:50% 22%} }
.title-wrap{align-self:stretch;margin-top:-34px}
.title-wrap .stage-title{margin:0}
.time-chip{position:absolute;right:0;bottom:calc(100% + 2px);height:26px;padding:0 9px 0 7px;border-radius:9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px var(--line);
  color:var(--ink-2);font:500 12px/1 var(--sans);letter-spacing:.02em;transition:color .6s,box-shadow .6s}
.time-chip svg{width:11px;height:11px;color:var(--sun);opacity:.85}
.time-chip.gone{display:none}
.time-chip.arriving{opacity:0}
.time-chip.lit{color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun-soft),0 0 18px var(--sun-soft)}
.time-chip:active{color:var(--ink)}
.puja.folding{overflow:hidden;transition:height .9s cubic-bezier(.65,0,.35,1),margin .9s cubic-bezier(.65,0,.35,1),opacity .45s ease;opacity:0;margin-top:0}
.puja.fading{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.puja-fly{position:fixed;z-index:30;margin:0;transform-origin:0 0;pointer-events:none;white-space:nowrap;text-align:center}
.meaning-link{display:inline-flex;align-items:center;gap:8px;min-height:40px;margin:6px 0 2px;color:var(--ink-2);font-size:14.5px}
.meaning-link svg{width:18px;height:18px;color:var(--sun)}
.place-now{margin:14px 0 0;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.025)}
.pn-row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px 10px 16px;text-align:left}
.pn-text{flex:1;display:flex;flex-direction:column;gap:1px}
.pn-city{font-size:17px;color:var(--sun)}
.pn-text small{font-size:13px;color:var(--ink-3)}
.pn-time{font-size:15px;color:var(--ink-2);white-space:nowrap}
.pn-edit{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.pn-edit svg{width:18px;height:18px;grid-area:1/1;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.pn-edit svg + svg{opacity:0;transform:rotate(-90deg)}
.place-now.open .pn-edit svg:first-child{opacity:0;transform:rotate(90deg)}
.place-now.open .pn-edit svg + svg{opacity:1;transform:none}
.place-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.2,.8,.2,1)}
.place-now.open .place-list{grid-template-rows:1fr}
.place-list-in{overflow:hidden;min-height:0;padding:0 16px;opacity:0;transition:opacity .3s ease}
.place-now.open .place-list-in{opacity:1;padding-bottom:8px;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.place-country{margin:20px 0 2px!important;font-size:12.5px!important;font-weight:500!important;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.places li{min-height:0}
.place-row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;text-align:left}
.place-row span{flex:1;font-size:16px;color:var(--ink)}
.place-row small{font-size:13.5px;color:var(--ink-3)}
.place-row svg{width:18px;height:18px;color:var(--sun);visibility:hidden}
.place-row[aria-pressed="true"] svg{visibility:visible}
.place-row[aria-pressed="true"] span{color:var(--sun)}
.terms{margin:8px 0 0}
.terms dt{margin:16px 0 3px;font:400 18px var(--serif);color:var(--ink)}
.terms dd{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.terms .num,.puja-sub,.place-row small{white-space:nowrap}
.stage:not(.is-lit) .more.after-light{display:none}
.rise{animation:rise-in .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise-in{from{opacity:0;transform:translateY(16px)}}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,25rem)}
.tile{position:relative;display:block;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--raise);text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%;transition:transform .6s ease}
.tile:active img{transform:scale(1.05)}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:26px 9px 9px;background:linear-gradient(transparent,rgba(0,0,0,.7));font:400 15px/1.2 var(--serif);color:#fff}
.tile small{display:block;font:500 11.5px var(--sans);color:rgba(255,255,255,.75);margin-bottom:2px}
.quiet{font-size:13px;line-height:1.5;color:var(--ink-3);max-width:24rem;margin:4px auto 0}

/* Buttons */
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);
  font:500 15px/1 var(--sans);letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;white-space:nowrap;
  transition:background .2s,border-color .2s}
.btn:active{background:var(--sun-soft)}
/* the main action takes the gold, lightly: gold words, a gold hairline, a breath of gold behind */
.btn.primary{color:var(--sun);border-color:var(--sun-soft);border-color:color-mix(in srgb,var(--sun) 42%,transparent);background:color-mix(in srgb,var(--sun) 7%,transparent)}
.btn.primary:active{background:var(--sun-soft)}
.btn svg{width:17px;height:17px;flex:none}
.link-btn{color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);min-height:44px;display:inline-flex;align-items:center;gap:8px}
.link-btn svg{width:17px;height:17px}

/* Notices */
.notice{display:flex;gap:10px;align-items:center;margin:0 auto 18px;max-width:25rem;padding:8px 8px 8px 14px;border-radius:16px;background:var(--glass);font-size:14px;color:var(--ink-2);text-align:left}
/* on the opening, the install offer sits over the photo, clear of the top bar and the diya */
#opening .notices{position:absolute;left:50%;top:max(70px,calc(var(--hero-h) * .2));z-index:6;width:min(calc(100% - 32px),25rem);transform:translateX(-50%)}
#opening .notice{margin:0;padding:10px 6px 10px 16px;border-radius:16px;font-size:15px;line-height:1.4;color:var(--ink);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.42);animation:w-fade .6s ease both}
#opening .notice .link-btn{min-height:44px;padding:0 6px;font-size:15px}
.notice p{margin:0;flex:1}
.notice .link-btn{color:var(--sun);font-weight:600;text-decoration:none}
.notice .x{color:var(--ink-3);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.notice .x svg{width:16px;height:16px}

/* PIN */
.pin-field{display:block;margin:20px auto 0;width:12rem;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
  text-align:center;font-size:26px;letter-spacing:.4em;padding-left:.4em}
.pin-field::placeholder{color:var(--ink-3)}
.pin-field.bad{border-color:var(--sun)}
.form-note{margin:10px auto 0;font-size:14px;color:var(--sun);max-width:20rem}
.form-note:empty{display:none}

/* A room for each aarti: the painting behind, the words rising over it */
.art{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.art-move{position:absolute;inset:0}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;opacity:0;transition:opacity 1.1s ease}
.art-img.ready{opacity:1}
.art-blur{position:absolute;inset:-40px;background-size:cover;background-position:50% 22%;filter:blur(22px) saturate(1.15);opacity:var(--dim,0)}
.art-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.32) 0%,transparent 16%,transparent 46%,var(--bg) 94%)}
.art-dim{position:absolute;inset:0;background:var(--bg);opacity:calc(var(--dim,0) * .74)}
.room{position:relative;z-index:2;touch-action:pan-y}
/* Swiping between aartis: the neighbour slides in beside the page, its painting a little slower, as through a window */
.peek{position:fixed;inset:0;z-index:4;overflow:hidden;background:var(--bg);color:var(--ink);pointer-events:none;--dim:0;--hint:0;
  box-shadow:0 0 70px rgba(0,0,0,.6);will-change:transform}
.peek.leaving{opacity:0;transition:opacity .22s ease}
.swipe-on .art,.swipe-on .art-move,.swipe-on #screen .room{will-change:transform}
:root.swiping{transition-duration:.42s}
.room-top{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(138px + env(safe-area-inset-bottom));max-width:34rem;margin:0 auto}
.eyebrow{margin:0;font:500 13px var(--sans);color:var(--ink-2);letter-spacing:.02em}
.room-title{margin:6px 0 0;font:400 40px/1.06 var(--serif);letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.room-dev{margin:8px 0 0;font-size:23px;line-height:1.4;color:var(--sun)}
.room-tag{margin:6px 0 0;font:300 16px/1.45 var(--sans);color:var(--ink-2)}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13px;color:var(--ink-2);opacity:calc(1 - var(--hint,0) * 2.4)}
.topfade{position:fixed;top:0;left:0;right:0;height:calc(92px + env(safe-area-inset-top));z-index:3;pointer-events:none;
  background:linear-gradient(var(--bg) 40%,transparent);opacity:var(--dim,0)}
.hint svg{width:16px;height:16px}
.room-body{max-width:34rem;margin:0 auto;padding:4px 20px calc(170px + env(safe-area-inset-bottom))}
.story{margin:0;font:300 18px/1.6 var(--sans);color:var(--ink)}
.glass{border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
.doing{display:flex;gap:12px;margin:18px 0 0;padding:14px 16px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.doing svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--sun)}
.play-card{margin:16px 0 0;padding:16px}
.play-note{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.play-src{margin:4px 0 0;font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;column-gap:10px}
.play-src .link-btn{font-size:13.5px}
.own-tag{color:var(--sun)}

/* Words: the verse in the middle of the screen glows, the rest fade back */
.words{margin-top:36px}
.block{margin:0 0 30px;opacity:var(--o,1);transition:opacity .45s ease}
.block.refrain{padding-left:16px;border-left:2px solid var(--sun)}
.block-tag{margin:0 0 8px;font:500 12.5px var(--sans);color:var(--ink-3);letter-spacing:.02em}
.ln{margin:0 0 9px;font:400 var(--ls)/1.5 var(--serif)}
.ln .x{margin-left:8px;font:500 12.5px var(--sans);color:var(--ink-3);white-space:nowrap;vertical-align:2px}
.ln .sub{display:block;margin-top:2px;font:400 max(13px,calc(var(--ls)*.64))/1.45 var(--sans);color:var(--ink-3)}
.ln.echo{padding-left:20px;color:var(--ink-2);font-size:calc(var(--ls)*.88)}
.ln.cue{color:var(--sun);font-size:calc(var(--ls)*.8)}
.words[data-mode="dev"] .ln .main{font-size:1.1em;line-height:1.55}
.words[data-mode="en"] .ln .main{font-size:.94em}
.words[data-mode="en"] .ln.echo .main:empty{display:none}
.words[data-mode="en"] .ln.echo .sub{margin-top:0}

/* What comes next: the next painting rises at the end */
.next-card{position:relative;display:block;width:100%;height:240px;margin-top:40px;border-radius:24px;overflow:hidden;text-align:left;background:var(--raise)}
.next-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.06);transition:transform 1s ease}
.next-card:active img{transform:scale(1.1)}
.next-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.72))}
.next-text{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.next-text small{display:block;font:500 12.5px var(--sans);color:rgba(255,255,255,.8)}
.next-text strong{display:block;margin-top:2px;font:400 27px/1.15 var(--serif)}
.next-text span{display:block;margin-top:3px;font:300 14px var(--sans);color:rgba(255,255,255,.82)}
.finish-card{display:flex;align-items:center;gap:14px;width:100%;margin-top:40px;padding:18px;text-align:left}
.mini-diya{position:relative;width:62px;height:62px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 26px var(--sun-soft)}
.mini-diya .hero-frame{left:-121px;top:-94px;height:171px;transform:none;-webkit-mask-image:none;mask-image:none}
.mini-diya .flame{opacity:1;animation:sway var(--sw) ease-in-out var(--sd) infinite}
.mini-diya .flame img{animation:flick var(--fl) ease-in-out var(--fd) infinite}
.finish-card strong{display:block;font:400 24px var(--serif)}
.finish-card span{display:block;font-size:14px;color:var(--ink-2)}

/* The dock: play, where you are in the song, casting, and how to show the words. It stays on screen. */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:6px;padding:6px;border-radius:18px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(0,0,0,.38);transform:translate(-50%,0);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;max-width:calc(100% - 20px)}
/* with a recording, a second row above: the position in the song, to drag, and the time */
.dock.has-seek{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"seek seek seek" "play cast seg";row-gap:0;column-gap:4px;
  width:min(calc(100% - 20px),27rem);padding:2px 6px 6px}
.dock .player.dockp{display:contents}
.dock-seek{grid-area:seek;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px}
.dock-seek .seek{flex:1;min-width:0;height:30px}
.dock-seek .pl-time{flex:none;min-width:74px;text-align:right;font-size:12px;color:var(--ink-2)}
.dock.has-seek [data-play]{grid-area:play}
.dock.has-seek [data-cast]{grid-area:cast}
.dock.has-seek .seg{grid-area:seg;justify-self:end}
/* Words that follow the song: the line being sung lights up; a quiet button brings the page back to it */
.ln .main{transition:color .35s ease,text-shadow .35s ease}
.words.synced .ln.sung .main,.words.timing .ln.sung .main{color:var(--sun);text-shadow:0 0 20px var(--sun-soft)}
.words.timing .ln.next{position:relative}
.words.timing .ln.next::before{content:'';position:absolute;left:-13px;top:.66em;width:6px;height:6px;border-radius:50%;background:var(--sun);box-shadow:0 0 8px var(--sun)}
.follow-chip{position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom));z-index:16;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;

<script>
(() => {
'use strict';
/* ---------- No pinch zoom ----------

document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

/* ---------- Settings you may change ---------- */
const PIN = '1008';                    // the PIN friends type in; the shared link carries it
const RELEASE = 19;
const API = 'https://script.google.com/macros/s/AKfycbzKuCKJfZ0VXmYA4Us6pOxa_C4Z1HJ4k1yxzG4ujkZX8OcqN9fIIbknYDkg0ovz9u_0/exec';   // visit messages: G's Apps Script web app (README, "Visit messages"); '' = off
const EXPECT_BUILD = 1;                // the Apps Script release this page needs

const C = window.Core;
const AARTIS = window.AartiData.AARTIS;
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const platform = isAndroid ? 'android' : isIOS ? 'ios' : 'other';
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Storage ---------- */
const P = 'aar.';
const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };

// Each room's background colour, for the phone's status bar
const ROOM_BG = { night: '#0A100A', ganesh: '#1B0F05', lakshmi: '#1E070D', jagdish: '#08122B' };
const LIT_FOR = 8 * 3600e3;            // the diya stays lit for the evening

const S = {
  set: Object.assign({ mode: 'rom', size: 'standard', bell: true }, get('settings', {})),
  unlocked: !!get('ok', false),
  own: get('own', {}),
  litAt: get('litAt', 0),
  route: { r: 'home' },
  installEvt: null,
  cur: null,            // which recording is loaded in the player: 'a:<id>' or 'bell'
  castAvail: null,
  wake: null,
};
delete S.set.theme;
const saveSet = () => put('settings', S.set);
const isLit = () => Date.now() - S.litAt < LIT_FOR;

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = (id) => AARTIS.find((a) => a.id === id);
const appUrl = () => location.origin + location.pathname;

const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  cast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M3 12.5a6.5 6.5 0 0 1 6.5 6.5M3 16a3 3 0 0 1 3 3"/><circle cx="3.6" cy="18.6" r=".9" fill="currentColor" stroke="none"/></svg>',
  airplay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 17H4.5A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5h-2"/><path d="M12 14.5l4.5 5h-9z" fill="currentColor"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c2.6 4 4.6 7.3 3.6 10.6-.6 2-2 3.4-3.6 3.4s-3-1.4-3.6-3.4C7.4 9.8 9.4 6.5 12 2.5Z"/><path d="M4 16.5c.6 3 3.9 5 8 5s7.4-2 8-5Z" opacity=".55"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
  chevDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".4" fill="currentColor"/></svg>',
  words: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5h16M4 11h16M4 15.5h10M4 20h7"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4M4 20l1-4.6L15.6 4.8a1.6 1.6 0 0 1 2.3 0l1.3 1.3a1.6 1.6 0 0 1 0 2.3L8.6 19 4 20Z"/></svg>',
  chevUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};

/* ---------- The diya: G's photo in layers ---------- */
// dark: the room before the lamp is lit; lit: the same scene with the flames laid on top, so they can move
function sceneHtml(mini) {
  const flames = ['l', 'r', 'c'].map((k) => `<span class="flame f${k}"><img src="flame-${k}.png" alt="" decoding="async" draggable="false"></span>`).join('');
  if (mini) return `<span class="hero-frame"><img class="scene" src="diya.jpg" alt="" decoding="async" draggable="false"><span class="flame fc"><img src="flame-c.png" alt="" decoding="async" draggable="false"></span></span>`;
  return `<span class="hero-move"><span class="hero-frame">
      <span class="hero-dark"><img class="scene" src="diya-dark.jpg" alt="" decoding="async" fetchpriority="high" draggable="false"><canvas class="water"></canvas><i class="wick"></i></span>
      <span class="hero-lit"><img class="scene" src="diya.jpg" alt="" decoding="async" draggable="false"><canvas class="water"></canvas><i class="mandala"></i><i class="halo"></i>${flames}</span>
    </span></span>`;
}

/* ---------- The water: the reflections ripple gently, drawn row by row; the bowl, lotuses and petals stay still ---------- */
const Water = (() => {
  const TOP = 712 / 1080;                     // the water starts here in the photo
  const mask = new Image(); mask.src = 'water.png';
  let items = [], raf = 0, last = 0, seen = true, io = null;
  function scan() {
    items = [...document.querySelectorAll('.hero canvas.water')].map((cv) => ({ cv, img: cv.parentNode.querySelector('img.scene'), w: 0, h: 0 }));
    if (io) io.disconnect();
    const hero = document.querySelector('.hero');
    seen = true;
    if (hero && 'IntersectionObserver' in window) {
      io = new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; if (seen) start(); });
      io.observe(hero);
    }
    items.forEach((it) => { const c = it.cv.getContext('2d'); c && c.clearRect(0, 0, it.cv.width, it.cv.height); });
    start();
  }
  function live(it) {
    if (!it.cv.isConnected) return false;
    const st = it.cv.closest('.stage');
    if (!st) return false;
    const lit = st.classList.contains('is-lit'), lighting = st.classList.contains('lighting');
    return it.cv.closest('.hero-lit') ? lit : (!lit || lighting);
  }
  function draw(it, t) {
    const { cv, img } = it;
    if (!img.complete || !img.naturalWidth || !mask.complete || !mask.naturalWidth) return;
    const r = cv.getBoundingClientRect(), cw = cv.offsetWidth;          // offsetWidth ignores the slow zoom, so the canvas keeps its size
    if (!r.width || !cw) return;
    const w = Math.min(1280, Math.round(cw * Math.min(2, devicePixelRatio || 1))), h = Math.round(w * (1 - TOP) * 9 / 16);
    if (it.w !== w || it.h !== h) { cv.width = w; cv.height = h; it.w = w; it.h = h; }
    const c = cv.getContext('2d');
    const iw = img.naturalWidth, ih = img.naturalHeight, sy0 = ih * TOP, sh = ih - sy0, step = 2;
    const A = w * .0042;                      // the largest ripple, nearest to us
    // only the part of the photo on screen is drawn (on a phone, about half of it)
    const f0 = Math.max(0, -r.left / r.width - .01), f1 = Math.min(1, (innerWidth - r.left) / r.width + .01);
    const dx0 = Math.floor(f0 * w), dw = Math.ceil(f1 * w) - dx0, sx = dx0 / w * iw, sw = dw / w * iw;
    c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, w, h);
    for (let y = 0; y < h; y += step) {
      const yn = y / h, depth = .3 + .7 * yn, ph = Math.sqrt(yn + .02) * 58;      // nearer water moves more; far reflections still shimmer
      const dx = A * depth * (Math.sin(ph - t * 1.15) * .62 + Math.sin(ph * 1.9 + t * .73 + 1.7) * .38);
      const dy = A * .35 * depth * Math.sin(ph * 2.3 - t * 1.6);
      const sy = Math.max(sy0, Math.min(ih - 1, sy0 + (y + dy) / h * sh));
      c.drawImage(img, sx, sy, sw, Math.max(1, step / h * sh), dx0 + dx, y, dw, step);
    }
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(mask, dx0 / w * mask.naturalWidth, 0, dw / w * mask.naturalWidth, mask.naturalHeight, dx0, 0, dw, h);
    c.globalCompositeOperation = 'source-over';
  }
  function frame(now) {
    raf = 0;
    if (document.hidden || !seen || reduced() || document.documentElement.classList.contains('drifting')) return;
    const on = items.filter(live);
    if (!on.length) return;
    if (now - last > 30) { last = now; on.forEach((it) => draw(it, now / 1000)); }
    raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf && !reduced() && !document.hidden) raf = requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  return { scan, start, running: () => !!raf };
})();

/* ---------- Sparks, embers and petals ---------- */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, parts = [], raf = 0, ambient = 0, petals = false, lastEmber = 0, lastPetal = 0, col = { sun: '#F2B65A', tint: '#E27B3C' };
  const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); };
  size(); addEventListener('resize', size);
  const colours = () => { const cs = getComputedStyle(document.documentElement); col = { sun: cs.getPropertyValue('--sun').trim() || col.sun, tint: cs.getPropertyValue('--tint').trim() || col.tint }; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  function spark(x, y, o) {
    parts.push(Object.assign({ k: 'spark', x, y, vx: rnd(-.6, .6), vy: rnd(-1.6, -.4), r: rnd(1, 2.4), life: 0, max: rnd(50, 95), c: Math.random() < .7 ? col.sun : col.tint }, o || {}));
  }
  function burst(x, y, n) {
    if (reduced()) return;
    colours();
    for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), s = rnd(.4, 2.6); spark(x, y, { vx: Math.cos(a) * s * .7, vy: Math.sin(a) * s * .7 - 1.1 }); }
    start();
  }
  let held = false;
  function step(t) {
    raf = 0;
    if (document.hidden || held) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (ambient && t - lastEmber > 900 / ambient) {
      lastEmber = t; colours();
      spark(rnd(0, W), H + 6, { k: 'ember', vx: rnd(-.15, .15), vy: rnd(-.55, -.25), r: rnd(.8, 1.8), max: rnd(420, 620), a: rnd(.25, .55) });
    }
    if (petals && t - lastPetal > 340) {
      lastPetal = t;
      parts.push({ k: 'petal', x: rnd(-10, W + 10), y: -14, vx: rnd(-.3, .3), vy: rnd(.6, 1.3), r: rnd(4, 7), rot: rnd(0, 6.3), vr: rnd(-.03, .03), life: 0, max: 900,
        c: ['#F7A21B', '#F4C430', '#E86A17', '#FFB347'][Math.floor(rnd(0, 4))] });
    }
    ctx.globalCompositeOperation = 'lighter';
    const next = [];
    for (const p of parts) {
      p.life++;
      if (p.life > p.max || p.y < -20 || p.y > H + 30) continue;
      next.push(p);
      if (p.k === 'petal') {
        p.x += p.vx + Math.sin((p.life + p.r * 30) / 40) * .45; p.y += p.vy; p.rot += p.vr;
        ctx.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = .85; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.globalCompositeOperation = 'lighter';
        continue;
      }
      p.x += p.vx + (p.k === 'ember' ? Math.sin((p.life + p.x) / 60) * .25 : 0); p.y += p.vy;
      if (p.k === 'spark') { p.vx *= .985; p.vy = p.vy * .985 - .012; }
      const f = 1 - p.life / p.max, a = (p.a || .9) * (p.k === 'ember' ? Math.sin(Math.PI * Math.min(1, p.life / p.max)) : f);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, p.c); g.addColorStop(1, 'transparent');
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    parts = next;
    if (parts.length || ambient || petals) start();
  }
  function start() { if (!raf && !reduced() && !document.hidden) raf = requestAnimationFrame(step); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  return {
    burst,
    hold(h) { held = !!h; if (held) ctx.clearRect(0, 0, W, H); else start(); },
    mood(a, p) { ambient = reduced() ? 0 : a; petals = !reduced() && !!p; if (!ambient && !petals && !parts.length) ctx.clearRect(0, 0, W, H); start(); },
    count: () => parts.length,
  };
})();

/* ---------- The bell, when the diya is lit ----------
   Made once, quietly in the background (an offline render), then simply played back. Nothing heavy happens
   at the moment it rings, so it stays clean on any phone while the screen animates. */
let AC = null, BELL = null, bellJob = null, bellIdle = 0;
const BELL_GAIN = 0.55;                           // the level the bell is made at; quieter rings scale from it
function prepareBell() {
  if (BELL || bellJob || !window.Bell) return;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return;
  try {
    const rate = 48000, off = new OAC(2, Math.round(rate * 10.4), rate);
    window.Bell.ring(off, off.destination, 0.02, { gain: BELL_GAIN });
    bellJob = new Promise((res) => {
      off.oncomplete = (e) => res(e.renderedBuffer);
      const r = off.startRendering();
      if (r && r.then) r.then(res, () => res(null));
    }).then((buf) => {
      if (!buf) return;
      // a gentle fade over the last half second, so the end of the sound can never click
      const n = buf.length, f = Math.round(buf.sampleRate * .5);
      for (let ch = 0; ch < buf.numberOfChannels; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < f; i++) d[n - f + i] *= 1 - i / f;
      }
      BELL = buf;
      document.body.dataset.bellReady = '1';
    }).catch(() => { bellJob = null; });
  } catch { bellJob = null; }
}
function audioCtx() {
  if (AC) return AC;
  const A = window.AudioContext || window.webkitAudioContext;
  try { AC = new A({ latencyHint: 'playback' }); } catch { AC = new A(); }   // a roomier buffer: no crackle when the phone is busy
  return AC;
}
function ringBell(opts) {
  if (S.set.bell === false || !window.Bell) return;
  try {
    const ctx = audioCtx();
    if (ctx.state !== 'running') ctx.resume();
    const level = (opts && opts.gain != null ? opts.gain : BELL_GAIN) / BELL_GAIN;
    const out = ctx.createGain(); out.gain.value = level; out.connect(ctx.destination);
    const at = ctx.currentTime + .04;
    if (BELL) {
      const src = ctx.createBufferSource(); src.buffer = BELL; src.connect(out); src.start(at);
    } else {
      window.Bell.ring(ctx, out, at, { gain: BELL_GAIN });   // not made yet (a very quick first touch): ring it live this once
      prepareBell();
    }
    document.body.dataset.bells = String((+document.body.dataset.bells || 0) + 1);
    // let the sound system rest once the bell has died away (Android and computers; iPhone keeps it ready)
    clearTimeout(bellIdle);
    if (!isIOS) bellIdle = setTimeout(() => { try { if (ctx.state === 'running') ctx.suspend(); } catch {} }, 11500);
  } catch {}
}
// make the bell soon after opening, once the page has settled
setTimeout(() => (window.requestIdleCallback || setTimeout)(prepareBell, { timeout: 2500 }), 900);

/* ---------- Routes and back ---------- */
let navigating = false;
function go(route, replace) {
  // ignore a second tap while the screen is already changing, or a tap on where you already are
  if (navigating || (route.r === S.route.r && route.id === S.route.id)) return;
  const prev = replace ? (history.state && history.state.prev) || 'home'
    : (S.route.r === 'home' ? 'home' : (history.state && history.state.prev) || 'home');
  const st = { ...route, prev };
  if (replace) history.replaceState(st, ''); else history.pushState(st, '');
  S.route = route;
  // a soft veil in the next room's colour while the screen changes
  const v = $('#veil');
  if (reduced()) { render(true); return; }
  navigating = true;
  v.classList.add('on');
  setTimeout(() => { navigating = false; render(true); requestAnimationFrame(() => requestAnimationFrame(() => v.classList.remove('on'))); }, 280);
}
// Back always goes up one level: an aarti or the closing screen goes to the start.
function up() {
  return new Promise((res) => {
    if (S.route.r === 'home') { res(); return; }
    const parent = 'home';
    if (history.state && history.state.prev === parent && history.length > 1) {
      let done = false;
      const fin = () => { if (done) return; done = true; window.removeEventListener('popstate', fin); setTimeout(res, 0); };
      window.addEventListener('popstate', fin);
      setTimeout(() => { if (!done) { S.route = { r: parent }; history.replaceState({ r: parent, prev: 'home' }, ''); render(true); fin(); } }, 400);
      history.back();
    } else {
      history.replaceState(parent === 'home' ? { r: 'home' } : { r: parent, prev: 'home' }, '');
      S.route = { r: parent };
      render(true);
      res();
    }
  });
}
window.addEventListener('popstate', (e) => {
  const st = e.state && e.state.r ? e.state : { r: 'home' };
  S.route = st.r === 'aarti' ? { r: 'aarti', id: st.id } : { r: st.r };
  render(true);
});

/* ---------- Screens ---------- */
function render(newScreen) {
  const back = $('#backBtn'), settings = $('#settingsBtn'), hands = $('#faithBtn'), tilak = $('#tilakBtn');
  settings.classList.toggle('gone', !S.unlocked);
  const r = S.route;
  hands.classList.toggle('gone', !(S.unlocked && ['home', 'done'].includes(r.r) && Drift.ready()));
  if (r.r !== 'home' && S.pujaSeen) S.pujaTucked = true;          // back from an aarti, the time waits in the corner
  if (r.r !== 'home') Tuck.stop();
  Swipe.drop();
  Visits.page(!S.unlocked ? 'pin' : r.r === 'aarti' ? r.id : r.r === 'done' ? 'done' : 'home');

  if (!tilak.innerHTML) tilak.innerHTML = TILAK;
  tilak.classList.toggle('gone', !(S.unlocked && (r.r === 'home' || (r.r === 'aarti' && byId(r.id)))));
  tilak.setAttribute('aria-label', r.r === 'aarti' && byId(r.id) ? `A reflection: ${REFLECT[r.id].title}` : `A reflection: ${REFLECT.diwali.title}`);
  if (!S.unlocked) {
    back.classList.add('gone'); setRoom('night');
    $('#screen').innerHTML = lockHtml(); FX.mood(.5, false); return;
  }
  const a = r.r === 'aarti' && byId(r.id);
  back.classList.toggle('gone', !a);
  if (a) {
    const i = AARTIS.indexOf(a);
    setRoom(a.id);
    $('#screen').innerHTML = roomHtml(a, i);
    const img = $('.art-img');
    const ready = () => img.classList.add('ready');
    if (img.complete && img.naturalWidth) ready(); else img.addEventListener('load', ready, { once: true });
    for (const nb of [AARTIS[i + 1], AARTIS[i - 1]]) if (nb) { const pre = new Image(); pre.src = nb.art; if (pre.decode) pre.decode().catch(() => {}); }
    prepPlayer(a);
    FX.mood(.6, false);
  } else if (r.r === 'done') {
    setRoom('night');
    $('#screen').innerHTML = doneHtml();
    FX.mood(.4, true);
  } else {
    S.route = { r: 'home' };
    setRoom('night');
    $('#screen').innerHTML = homeHtml();
    if ($('#puja')) S.pujaSeen = true;
    if (S.pujaTucked && PT) updateChip();
    fitHome();
    renderNotices();
    FX.mood(isLit() ? .8 : .35, false);
    maybeWelcome();
    Tuck.start();
    Flames.wake();
  }
  syncPlayers();
  keepAwake();
  Water.scan();
  Spot.schedule();
  Swipe.tease();
  Sync.afterRender();
  if (newScreen) { window.scrollTo(0, 0); S.lastY = 0; }
  onScroll();
}

// The opening fits the screen without scrolling: the photo gives up height until all that's below it fits,

/* ---------- Scrolling in a room: the painting softens and the verse in view glows ---------- */
let scrollRaf = 0;
function onScroll() {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    const scr = $('#screen');
    if (S.route.r !== 'aarti') { scr.style.removeProperty('--dim'); scr.style.removeProperty('--hint'); return; }
    const y = window.scrollY, vh = innerHeight;
    scr.style.setProperty('--dim', Math.min(1, Math.max(0, (y - vh * .12) / (vh * .6))).toFixed(3));
    scr.style.setProperty('--hint', Math.min(1, Math.max(0, y / (vh * .5))).toFixed(3));
    const mid = vh * .45, blocks = document.querySelectorAll('.words .block');
    let best = null, bd = 1e9;
    blocks.forEach((b) => {
      const r = b.getBoundingClientRect(), c = r.top + r.height / 2, d = Math.abs(c - mid);
      b.style.setProperty('--o', (1 - Math.min(1, d / (vh * .55)) * .62).toFixed(3));
      if (d < bd) { bd = d; best = b; }
    });
    blocks.forEach((b) => b.classList.toggle('now', b === best));

  });
}

/* ---------- Lakshmi Puja: the time for your place ----------
   The times come with the app (puja-times.js), worked out for each place in its own local time: nothing is looked up.
   The place starts as a best guess from the phone's time zone; a tap on it changes it. */
const PT = window.PujaTimes || null;
function placeById(id) { return PT && PT.places.find((p) => p.id === id); }
function guessPlace() {
  if (!PT) return null;
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch {}
  if (PT.guess[tz]) return placeById(PT.guess[tz]);
  // otherwise the place whose clock matches this phone's on the evening, or the nearest to it
  const off = -new Date(PT.places[0].t[1]).getTimezoneOffset();
  let best = placeById('london'), bd = 1e9;
  for (const p of PT.places) { const d = Math.abs(p.off - off); if (d < bd) { bd = d; best = p; } }
  return best;
}
function myPlace() { return placeById(S.set.place) || guessPlace(); }
// where the evening has got to, for this place
function pujaState(p, now) {
  const [, from, to, , pEnd] = p.t;
  if (now >= pEnd) return 'was';
  if (now >= to) return 'pradosh';
  if (now >= from) return 'now';
  if (now >= p.t[0]) return 'today';
  return 'ahead';
}
function pujaHtml() {
  const p = myPlace();
  if (!p) return '';
  return `<div class="puja" id="puja">${pujaInner(p)}</div>`;
}
function pujaInner(p) {
  const st = pujaState(p, Date.now());
  const label = { ahead: 'Lakshmi Puja muhurat', today: 'Lakshmi Puja muhurat today', now: 'Lakshmi Puja muhurat now', pradosh: 'Pradosh Kaal continues', was: 'Lakshmi Puja muhurat was' }[st];
  const time = st === 'now' ? `until ${p.to}` : st === 'pradosh' ? `until ${p.pradoshTo}` : p.muhurat;
  const when = st === 'pradosh' ? `Muhurat was ${p.muhurat} · ` : st === 'ahead' || st === 'was' ? `${PT.day} · ` : '';
  return `<p class="puja-label"><span>${label}</span><button class="info-btn" type="button" data-act="pujaInfo" aria-label="What these words mean">${ICON.info}</button></p>
    <p class="puja-time num${st === 'now' ? ' lit' : ''}">${esc(time)}</p>
    <p class="puja-sub">${esc(when)}<button class="place-btn" type="button" data-act="place" aria-label="Times for ${esc(p.city)}. Change place">${esc(p.city)}${ICON.chevDown}</button></p>`;
}

/* ---------- The puja time tucks into the corner after a minute on the opening ---------- */
const Tuck = (() => {
  const AFTER = 60000, SOONEST = 6000;
  let timer = 0, shown = 0;
  function start() {
    if (S.pujaTucked || S.route.r !== 'home' || !S.unlocked || !get('welcomed', false) || !PT || timer) return;
    shown = Date.now();
    timer = setTimeout(tuck, AFTER);
  }
  // they've started to move about the page: tuck it now, or as soon as it has been seen for 6 seconds
  function nudge() {
    if (!timer || S.pujaTucked || S.route.r !== 'home') return;
    clearTimeout(timer);
    timer = setTimeout(tuck, Math.max(0, shown + SOONEST - Date.now()));
  }
  function stop() { clearTimeout(timer); timer = 0; }
  function busy() { return $('#sheet').open || $('#welcome').open || $('#reflect').open || Drift.isOpen(); }
  function tuck() {
    timer = 0;
    if (S.route.r !== 'home' || S.pujaTucked) return;
    if (busy()) { timer = setTimeout(tuck, 4000); return; }
    S.pujaTucked = true;
    const block = $('#puja'), chip = $('#pujaChip');
    updateChip(); chip.classList.remove('gone'); chip.classList.add('arriving');
    const t = block && block.querySelector('.puja-time');
    const a = t && t.getBoundingClientRect(), z = chip.querySelector('.chip-time').getBoundingClientRect();
    const seen = a && a.bottom > 0 && a.top < innerHeight;
    if (!block) { chip.classList.remove('arriving'); return; }
    // At the top of the page the line folds away and the words below rise into its place.
    // Scrolled down, it just fades and keeps its space, so nothing on screen moves.
    const fold = window.scrollY < 12;
    block.setAttribute('aria-hidden', 'true');
    if (fold) {
      block.style.height = block.offsetHeight + 'px';
      void block.offsetHeight;
      block.classList.add('folding');
      block.style.height = '0px';
    } else block.classList.add('fading');
    const finish = () => { if (fold) block.remove(); };
    if (reduced() || !seen || !t.animate) {
      chip.classList.remove('arriving');
      setTimeout(finish, reduced() ? 0 : 900);
      return;
    }
    // the time itself glides up past the heading and settles just above its end, softening as it crosses the words
    const fly = t.cloneNode(true);
    fly.classList.add('puja-fly');
    Object.assign(fly.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px' });
    document.body.append(fly);
    t.style.visibility = 'hidden';
    const s = z.height / a.height * 1.08;
    const tx = z.left + z.width / 2 - (a.left + a.width * s / 2), ty = z.top + z.height / 2 - (a.top + a.height * s / 2);
    const end = `translate(${tx}px, ${ty}px) scale(${s})`;
    fly.animate([{ transform: 'none', opacity: 1 }, { opacity: .5, offset: .48 }, { transform: end, opacity: 1, offset: .82 }, { transform: end, opacity: 0 }],
      { duration: 1000, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }).finished.then(() => fly.remove(), () => fly.remove());
    chip.animate([{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 460, delay: 640, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    chip.classList.remove('arriving');
    setTimeout(finish, 1000);
  }
  addEventListener('scroll', () => { if (window.scrollY > 4) nudge(); }, { passive: true });
  addEventListener('wheel', nudge, { passive: true });
  document.addEventListener('touchmove', (e) => { if (!e.target.closest || !e.target.closest('dialog')) nudge(); }, { passive: true });
  return { start, stop, tuck, nudge };
})();
function chipInner(p) {
  const st = pujaState(p, Date.now());
  const text = st === 'now' ? `Now · until ${p.to}` : st === 'pradosh' ? `Pradosh · until ${p.pradoshTo}` : p.muhurat;
  return { st, html: `${ICON.flame}<span class="chip-time num">${esc(text)}</span>`, label: `Lakshmi Puja muhurat in ${p.city}: ${text}. Change place` };
}
function updateChip() {
  const chip = $('#pujaChip'), p = myPlace();

  chip.classList.toggle('lit', c.st === 'now');

/* ---------- The flames answer the phone's movement ----------
   As Daily Drift lets you move through its stars, the three flames here feel the phone: tilt it and they stay upright,
   as real flames do; move it suddenly and they lean into the movement, flutter and settle again, each in its own time.
   The light shifts with them; the picture itself stays still. iPhone asks once, on the first tap. */
const Flames = (() => {
  const OK = 'DeviceMotionEvent' in window;
  const ASK = isIOS && OK && typeof DeviceMotionEvent.requestPermission === 'function';
  // each flame: how quickly it answers (rad/s) and how lively it is; the small ones are quicker
  const SPEC = { c: { w: 8.5, z: .3, n: 1 }, l: { w: 11, z: .26, n: .8 }, r: { w: 10.2, z: .28, n: .85 } };
  const st = {};
  for (const k in SPEC) st[k] = { a: 0, v: 0, ph: Math.random() * 100 };
  let on = false, asked = false, raf = 0, last = 0, heard = 0, sign = isIOS ? -1 : 1, signN = 0;
  let fx = 0, fy = 9.81, fz = 0, spin = 0, agit = 0, lastF = null;
  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null) return;
    let x = +g.x || 0, y = +g.y || 0, z = +g.z || 0;
    // which way is up differs between phones: learn it from how the phone is held (upright, more or less)
    if (signN < 12 && Math.abs(y) > 3) { signN++; if (signN === 12 || signN === 1) sign = y > 0 ? 1 : -1; }
    x *= sign; y *= sign; z *= sign;
    const ang = (screen.orientation && screen.orientation.angle) || 0;
    if (ang) { const r = ang * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); [x, y] = [x * c + y * s, -x * s + y * c]; }
    // a little smoothing for the sensor's own noise
    fx += (x - fx) * .35; fy += (y - fy) * .35; fz += (z - fz) * .2;
    const r = e.rotationRate || {};
    const rate = Math.hypot(+r.alpha || 0, +r.beta || 0, +r.gamma || 0);
    const jolt = lastF ? Math.hypot(x - lastF[0], y - lastF[1]) : 0; lastF = [x, y];
    spin = Math.max(spin * .9, Math.min(1, rate / 200 + jolt / 5));
    heard = performance.now();
    wake();
  }
  function start() { if (on || !OK) return; addEventListener('devicemotion', onMotion); on = true; }
  async function ask() {
    if (!ASK) { start(); return; }
    try { const res = await DeviceMotionEvent.requestPermission(); put('motionPerm', res); if (res === 'granted') start(); } catch {}
  }
  function tap(e) {
    if (!e.isTrusted || on || asked || !ASK || get('motionPerm', '') === 'denied') return;
    asked = true; ask();
  }
  document.addEventListener('touchend', tap, true);
  document.addEventListener('click', tap, true);
  if (OK && !ASK) start();
  function live() {
    return on && S.route.r === 'home' && !reduced() && !document.hidden && !document.documentElement.classList.contains('drifting')
      && !!document.querySelector('#opening.is-lit .hero');
  }
  function wake() { if (!raf && live()) { last = 0; raf = requestAnimationFrame(step); } }
  // smooth, unrepeating movement for the flutter
  const noise = (t, p) => Math.sin(t * 7.1 + p) * .5 + Math.sin(t * 11.3 + p * 1.7) * .3 + Math.sin(t * 17.9 + p * 2.3) * .2;
  function step(now) {
    raf = 0;
    if (!live()) { rest(); return; }
    const dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now;
    const t = now / 1000;
    // where "up" is, on the screen: the flames point there, softly limited
    const inPlane = Math.hypot(fx, fy), w = Math.max(0, Math.min(1, (inPlane - 2) / 5));
    const raw = Math.atan2(fx, fy);
    const target = .62 * Math.tanh(raw / .62) * w;
    agit += ((spin > agit ? spin : spin * .6) - agit) * (spin > agit ? .5 : .04);
    let moving = Math.abs(agit) > .01;
    for (const k in SPEC) {
      const s = st[k], p = SPEC[k];
      // a spring that overshoots a little, as a flame does when it's moved
      const acc = p.w * p.w * (target - s.a) - 2 * p.z * p.w * s.v;
      s.v += acc * dt; s.a += s.v * dt;
      if (Math.abs(s.v) > .002 || Math.abs(target - s.a) > .002) moving = true;
      const flutter = agit * p.n;
      const lean = s.a + flutter * .14 * noise(t, s.ph);
      const tall = 1 + flutter * (.09 * noise(t * 1.3, s.ph + 4) - .03);
      const el = document.querySelector(`#opening .hero .f${k}`);
      if (el) { el.style.rotate = `${(lean * 57.3).toFixed(2)}deg`; el.style.scale = `${(1 - flutter * .03).toFixed(3)} ${tall.toFixed(3)}`; }
    }
    // the light follows the centre flame
    const halo = document.querySelector('#opening .halo');
    if (halo) { halo.style.translate = `${(st.c.a * 22).toFixed(1)}px ${(-Math.abs(st.c.a) * 6).toFixed(1)}px`; halo.style.scale = (1 + agit * .06 * noise(t * .8, 9)).toFixed(3); }
    if (moving || now - heard < 1500) raf = requestAnimationFrame(step);
  }
  function rest() {
    document.querySelectorAll('#opening .hero .flame').forEach((el) => { el.style.rotate = ''; el.style.scale = ''; });
    const halo = document.querySelector('#opening .halo'); if (halo) { halo.style.translate = ''; halo.style.scale = ''; }
    for (const k in st) { st[k].a = 0; st[k].v = 0; }
    agit = 0;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  return { wake, ask, active: () => on };
})();

/* ---------- The tilak calls, once on each page ----------
   If the tilak hasn't been tapped after a while on a page, and the person is resting at the top of it,
   the screen dims softly around the tilak with a word of invitation. Once per page; a tap anywhere lets it go. */
const Spot = (() => {
  const WAIT = { home: 10000, aarti: 9000 };
  let timer = 0, el = null, auto = 0;
  const seen = (k) => !!get('spotSeen', {})[k];
  function mark(k) { const s = get('spotSeen', {}); if (!s[k]) { s[k] = true; put('spotSeen', s); } }
  function schedule() {
    clearTimeout(timer); timer = 0; hide(true);
    const k = reflectKey();
    if (!k || !S.unlocked || seen(k)) return;
    if (k === 'diwali' && !isLit()) return;                 // first, the diya: lighting it starts the wait
    timer = setTimeout(() => attempt(k, 0), WAIT[S.route.r] || 9000);
  }
  function attempt(k, n) {
    timer = 0;
    if (reflectKey() !== k || seen(k)) return;
    const t = $('#tilakBtn');
    const busy = !S.unlocked || document.hidden || navigating || window.scrollY > 40 || !t || t.classList.contains('gone') || !audio.paused
      || $('#sheet').open || $('#welcome').open || $('#reflect').open || Drift.isOpen() || document.querySelector('.puja-fly');
    if (busy) { if (n < 20) timer = setTimeout(() => attempt(k, n + 1), 3000); return; }
    show(k);
  }
  function show(k) {
    mark(k);
    const r = $('#tilakBtn').getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    el = document.createElement('div');
    el.className = 'spot';
    el.setAttribute('role', 'presentation');
    el.style.setProperty('--sx', x + 'px'); el.style.setProperty('--sy', y + 'px');
    el.innerHTML = `<p class="spot-say" style="top:${Math.round(y + 44)}px">Tap for a reflection</p>`;
    document.body.append(el);
    $('#tilakBtn').classList.add('calling');
    requestAnimationFrame(() => requestAnimationFrame(() => el && el.classList.add('on')));
    el.addEventListener('click', (e) => {
      const near = Math.hypot(e.clientX - x, e.clientY - y) < 46;
      hide();
      if (near) openReflect();
    });
    auto = setTimeout(() => hide(), 6500);
  }
  function hide(now) {
    clearTimeout(auto);
    const t = $('#tilakBtn'); if (t) t.classList.remove('calling');
    if (!el) return;
    const e = el; el = null;
    if (now || reduced()) { e.remove(); return; }
    e.classList.remove('on'); setTimeout(() => e.remove(), 600);
  }
  addEventListener('scroll', () => { if (el && window.scrollY > 40) hide(); }, { passive: true });
  return { schedule, mark, hide, showing: () => !!el };
})();

/* ---------- Audio: recordings and the test bell ---------- */

/* ---------- Google Cast (Chrome on Android and computers) ----------
   The app tells the TV exactly what to play, with its name and the diya, and hears back how it's going.
   If Google's library can't load, the browser's own casting is used instead, and AirPlay on iPhone. */
const CAST_LIB = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
let CAF = null;
function loadCastLib() {

  const el = document.createElement('script');

function initCaf() {

  const player = new F.RemotePlayer(), ctrl = new F.RemotePlayerController(player);

  avail(ctx.getCastState());
  ctx.addEventListener(F.CastContextEventType.CAST_STATE_CHANGED, (e) => { avail(e.castState); syncPlayers(); });
  ctx.addEventListener(F.CastContextEventType.SESSION_STATE_CHANGED, onCafSession);

}
const cafOn = () => !!(CAF && CAF.player.isConnected);
function castName() {
  try { return CAF.ctx.getCurrentSession().getCastDevice().friendlyName || 'your speaker'; } catch { return 'your speaker'; }
}
// Which of the app's sounds is on the TV right now, if any
function remoteKey() {
  if (!cafOn() || !CAF.player.isMediaLoaded || !CAF.player.mediaInfo) return null;
  const id = CAF.player.mediaInfo.contentId;
  const el = [...document.querySelectorAll('.player')].find((x) => abs(x.dataset.url) === id);
  if (el) return el.dataset.key;
  if (abs('test-bell.mp3') === id) return 'bell';
  const a = AARTIS.find((x) => x.audio && abs(x.audio) === id);
  return a ? 'a:' + a.id : null;
}
function onCafSession(e) {
  const SS = CAF.F.SessionState;
  if (e.sessionState === SS.SESSION_STARTING) toast('Connecting…', true);
  else if (e.sessionState === SS.SESSION_START_FAILED) {
    const m = 'Couldn’t connect. Check the speaker or TV is on, and on the same Wi-Fi as this phone.';
    toast(m); castNote(m);
  } else if (e.sessionState === SS.SESSION_ENDED) {
    // pick up on this phone where the TV got to, paused
    const L = CAF.last;
    if (L && L.key === S.cur && isFinite(audio.duration)) { try { audio.currentTime = Math.min(L.t, audio.duration); } catch {} }
    CAF.last = null; CAF.loading = null;

  }

}
async function cafLoad(p) {
  const sess = CAF.ctx.getCurrentSession();
  if (!sess) return;
  const key = p.dataset.key, title = p.dataset.title, name = castName();
  const from = S.cur === key && isFinite(audio.currentTime) && !audio.ended ? audio.currentTime : 0;
  if (!audio.paused) audio.pause();             // the TV takes over
  const mi = new chrome.cast.media.MediaInfo(abs(p.dataset.url), C.mimeFor(p.dataset.url));
  mi.streamType = chrome.cast.media.StreamType.BUFFERED;
  const md = new chrome.cast.media.MusicTrackMediaMetadata();
  md.title = title; md.artist = p.dataset.sub || 'Aarti'; md.albumName = 'Diwali aarti';
  md.images = [new chrome.cast.Image(abs(p.dataset.art || 'icon-512.png'))];
  mi.metadata = md;
  const req = new chrome.cast.media.LoadRequest(mi);
  req.autoplay = true; req.currentTime = from;

  try {
    const err = await sess.loadMedia(req);
    if (err) throw err;
    toast(`Playing on ${name}`);
    castNote(`Connected. ${title} is playing on ${name}.`);
  } catch {
    const m = `${name} couldn’t play ${title}. Try again, or play it on this phone.`;

async function cafCast(p) {

    try { await CAF.ctx.requestSession(); } catch {}

    try { await CAF.ctx.requestSession(); }

}

async function togglePlay(el) {
  const p = el.closest('.player');

// How long each recording is, so the bar can show it before it's played (read once from the file's start)
const Lens = (() => {

    of(url) {
